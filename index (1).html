/* nhãn ở GSCAN nhưng tên trong GB hơi khác */
const GALIAS={"처럼 · 쯤 · 마다":"쯤 · 마다 · 처럼"};
function scanGrammar(lines){const found=new Map();
  lines.forEach(([ko,vi])=>{const s=String(ko);
    for(const [lab,re,chk] of GSCAN){const gi=GBI[GALIAS[lab]||lab];if(gi===undefined)continue;
      const m=s.match(re);if(!m)continue;let ok=true;try{if(chk)ok=chk(m,s);}catch(e){ok=false;}if(!ok)continue;
      const e=found.get(gi)||{gi,ex:[]};if(e.ex.length<3&&!e.ex.some(x=>x[0]===s))e.ex.push([s,vi,m[0].trim()]);found.set(gi,e);}});
  return [...found.values()].sort((a,b)=>GB[a.gi].lv-GB[b.gi].lv||a.gi-b.gi);}
function grammarSheet(l,only){
  const lines=only||[...(l.d||[]).map(x=>[x[1],x[2]]),...(l.p||[]).map(x=>[x[0],x[2]])];
  const res=scanGrammar(lines);
  const sh=document.createElement("div");sh.className="sheet-bg";
  sh.innerHTML=`<div class="sheet gsheet" role="dialog" aria-label="Cấu trúc ngữ pháp trong bài"><div class="gs-head">${tteok("think",56)}<div><h3>${only?"Ngữ pháp trong câu này":"Cấu trúc ngữ pháp trong bài"}</h3>${only?`<p class="fr gs-line">${esc(only[0][0])}</p>`:""}<p class="note">${res.length?(only?`Câu này có ${res.length} cấu trúc:`:`Bé Tteok tìm được ${res.length} cấu trúc trong câu và hội thoại của bài này.`):"Bài này chủ yếu là câu cố định, chưa có cấu trúc ngữ pháp riêng."}</p></div><button class="icon sm" id="gsX" aria-label="Đóng">✕</button></div>
   <div class="gs-list">${res.map(({gi,ex})=>{const g=GB[gi];return `<div class="card gs-item"><div class="gs-top"><b class="fr">${esc(g.g)}</b><span class="glv l${g.lv}">${GLV[g.lv]}</span></div>
     <p class="gmean">${esc(g.m)}</p><div class="gform"><b>Cách dùng</b><p>${esc(g.f)}</p></div>${g.n?`<p class="note">💡 ${esc(g.n)}</p>`:""}
     <p class="gs-in">Trong bài:</p>${ex.map(([s,vi,hit])=>`<button class="gs-ex" data-say="${esc(s)}"><span class="fr">${esc(s).replace(esc(hit),`<mark>${esc(hit)}</mark>`)}</span><small>${esc(vi)}</small></button>`).join("")}
     <button class="btn sm" data-gp="${gi}">Xem thêm ví dụ & luyện tập →</button></div>`;}).join("")}</div></div>`;
  document.body.appendChild(sh);
  const close=()=>{sh.remove();};sh.onclick=e=>{if(e.target===sh)close();};sh.querySelector("#gsX").onclick=close;
  sh.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say,.85));
  sh.querySelectorAll("[data-gp]").forEach(b=>b.onclick=()=>{close();grammarPoint(+b.dataset.gp);});
}

/* gắn chip 🧩 vào từng câu trong bài giao tiếp */
function decorateLesson(l){const body=document.getElementById("body");if(!body||!l)return;
  const deco=()=>{body.querySelectorAll(".line .bubble[data-k]").forEach(b=>{const ln=b.closest(".line");if(ln.querySelector(".gchip"))return;const x=l.d[+b.dataset.k];if(!x)return;const r=scanGrammar([[x[1],x[2]]]);if(!r.length)return;
      const c=document.createElement("button");c.className="gchip";c.innerHTML=`🧩 ${r.map(z=>esc(GB[z.gi].g)).slice(0,2).join(" · ")}${r.length>2?" +"+(r.length-2):""}`;c.onclick=e=>{e.stopPropagation();grammarSheet(l,[[x[1],x[2]]]);};ln.appendChild(c);});
    body.querySelectorAll(".card.phrase").forEach(cd=>{if(cd.querySelector(".gchip"))return;const k=cd.querySelector("[data-k]");if(!k)return;const x=l.p[+k.dataset.k];if(!x)return;const r=scanGrammar([[x[0],x[2]]]);if(!r.length)return;
      const c=document.createElement("button");c.className="gchip";c.innerHTML=`🧩 ${r.map(z=>esc(GB[z.gi].g)).slice(0,2).join(" · ")}${r.length>2?" +"+(r.length-2):""}`;c.onclick=e=>{e.stopPropagation();grammarSheet(l,[[x[0],x[2]]]);};cd.appendChild(c);});};
  deco();if(body._gobs)body._gobs.disconnect();const ob=new MutationObserver(()=>{ob.disconnect();deco();ob.observe(body,{childList:true,subtree:true});});ob.observe(body,{childList:true,subtree:true});body._gobs=ob;}

const gsURL=()=>window.SYNC_URL&&/^https:\/\/script\.google\.com\//.test(window.SYNC_URL)?window.SYNC_URL:null;
async function gsPost(body){const r=await fetch(gsURL(),{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(j.err||"lỗi");return j;}
let _uid=null;async function myUid(){if(_uid)return _uid;try{const u=window.claude&&claude.use?await claude.use("user"):null;_uid=u&&u.id?await u.id():null;}catch(e){}return _uid;}
async function dbx(){return (window.claude&&claude.use)?claude.use("db").catch(()=>null):null;}
const API={
  async cmsGet(){if(gsURL()){const r=await fetch(gsURL()+"?cms=1",{redirect:"follow"});const j=await r.json();return j.ok?(j.cms||{}):{};}
    const db=await dbx();if(!db)return null;const s=await db.doc("cms/main").get();if(!s.exists)return {};try{return JSON.parse(s.data().j||"{}");}catch(e){return {};}},
  async cmsSet(o){if(gsURL())return gsPost({op:"admin",act:"cms",aid:CODE_ID,cms:JSON.stringify(o)});const db=await dbx();if(!db)throw new Error("Chưa kết nối chỗ lưu");await db.doc("cms/main").set({j:JSON.stringify(o),t:Date.now()});},
  async fbAdd(f){if(gsURL())return gsPost(Object.assign({op:"fb"},f));const db=await dbx();const uid=await myUid();if(!db||!uid)throw new Error("Trang này chưa cho gửi góp ý. Hãy mở bản web chính nhé.");
    const ref=db.doc("feedback/"+uid);const s=await ref.get();const items=(s.exists&&s.data().items)||[];items.push(f);await ref.set({items:items.slice(-30),t:Date.now()});},
  async fbList(){if(gsURL())return (await gsPost({op:"admin",act:"list",aid:CODE_ID})).items||[];const db=await dbx();if(!db)return [];
    const q=await db.collection("feedback").get();const out=[];q.docs.forEach(d=>((d.data()||{}).items||[]).forEach((x,i)=>out.push(Object.assign({id:d.id+"#"+i},x))));return out.sort((a,b)=>(b.t||0)-(a.t||0));},
  async fbDel(id){if(gsURL())return gsPost({op:"admin",act:"del",aid:CODE_ID,id});const db=await dbx();const [doc,i]=id.split("#");const ref=db.doc("feedback/"+doc);const s=await ref.get();if(!s.exists)return;const items=s.data().items||[];items.splice(+i,1);await ref.set({items,t:Date.now()});},
  async codes(){if(gsURL())return (await gsPost({op:"admin",act:"codes",aid:CODE_ID})).items||[];const db=await dbx();if(!db)return [];
    const q=await db.collection("progress").get();return q.docs.map(d=>{const x=d.data()||{};let s={};try{s=JSON.parse(x.s||"{}");}catch(e){}return codeSum(d.id,x.t,s);});},
  async delCode(id){if(gsURL())return gsPost({op:"admin",act:"delcode",aid:CODE_ID,id});const db=await dbx();await db.doc("progress/"+id).delete();},
  async stats(){if(gsURL())return gsPost({op:"admin",act:"stats",aid:CODE_ID});const db=await dbx();if(!db)return {};const a=await db.collection("progress").get();const b=await db.collection("feedback").get();let n=0;b.docs.forEach(d=>n+=((d.data()||{}).items||[]).length);return {codes:a.docs.length,feedback:n};}
};

   <label><b>🧩 Điểm ngữ pháp (thêm)</b><small>Dòng đầu: ## Ngữ pháp | cấp (1–4) | nghĩa | cách dùng | lưu ý. Các dòng ví dụ: = câu tiếng Hàn | nghĩa. Cách nhau 1 dòng trống.</small><textarea id="cGram" rows="6" placeholder="## -(으)ㄹ 줄 몰랐어요 | 3 | không ngờ là… | Gốc + (으)ㄹ 줄 몰랐다 | Dùng khi bất ngờ\n= 이렇게 어려울 줄 몰랐어요. | Không ngờ lại khó thế này.">${esc(gram)}</textarea></label>
   <label><b>🎙️ Câu luyện nói & nghe chép (thêm)</b><small>Mỗi dòng: câu tiếng Hàn | nghĩa</small><textarea id="cSpeak" rows="4" placeholder="오늘 날씨가 정말 좋네요 | Hôm nay trời đẹp thật">${esc(lines(c.speak))}</textarea></label>
  </details>
  <details class="card"><summary>☕ Sách, ủng hộ & chân trang</summary>
   <label class="ck big"><input type="checkbox" id="cBookOn" ${c.bookOff?"":"checked"}> <b>Hiện mục “Nhận sách PDF qua email”</b></label>
   <label><b>Giới thiệu sách</b><textarea id="cBookT" rows="2" placeholder="Để trống là dùng câu mặc định">${esc(c.bookText||"")}</textarea></label>
   <label><b>Lời nhắn phần ủng hộ</b><textarea id="cDonate" rows="2" placeholder="Để trống là dùng lời nhắn mặc định">${esc(c.donate||"")}</textarea></label>
   <div><b>Mã QR ủng hộ</b><div class="bar" style="align-items:center;margin-top:6px"><img id="cQrPrev" class="qr" style="width:110px" src="${c.qr||QR_IMG}" alt="QR hiện tại"><label class="btn sm">📷 Đổi ảnh QR<input type="file" id="cQr" accept="image/*" hidden></label><button class="btn sm" id="cQrR" type="button">Dùng QR mặc định</button></div></div>
   <label><b>Chữ ở chân trang</b><small>Để trống là dùng câu mặc định về janatelier.</small><textarea id="cFooter" rows="2">${esc(c.footer||"")}</textarea></label>
   <label><b>Email liên hệ</b><input id="cEmail" class="g-in sm" value="${esc(c.email||"")}" placeholder="${CONTACT}"></label>
  </details>
  <details class="card"><summary>🛠 Chế độ bảo trì</summary>
   <label class="ck big"><input type="checkbox" id="cMOn" ${mt.on?"checked":""}> <b>Bật bảo trì</b> <small>(mọi người trừ admin sẽ thấy màn hình bảo trì)</small></label>
   <label><b>Lời nhắn bảo trì</b><input id="cMText" class="g-in sm" value="${esc(mt.text||"")}" placeholder="TteokTalk đang được nâng cấp, quay lại sau ít phút nha!"></label>
  </details>
  <details class="card"><summary>💾 Sao lưu & khôi phục</summary>
   <p class="note">Chép đoạn này cất đi để phòng khi lỡ tay. Dán đoạn đã lưu vào rồi bấm Khôi phục để lấy lại.</p>
   <textarea id="cJson" rows="5" spellcheck="false" style="font-family:monospace;font-size:.8rem">${esc(JSON.stringify(c))}</textarea>
   <div class="bar"><button class="btn sm" id="cCopy" type="button">⧉ Chép</button><button class="btn sm" id="cImp" type="button">↩ Khôi phục từ đoạn trên</button></div>
  </details>
  <div class="cms-save"><button class="btn primary" id="cSave">💾 Lưu & cập nhật cho mọi người</button><button class="btn" id="cPrev">👀 Xem thử</button><span class="note" id="cMsg"></span></div></div>`;
  let qr=c.qr||"",accent=c.accent||"";
  el.querySelector("#cAccent").oninput=e=>{accent=e.target.value;el.querySelector("#cAccV").textContent=accent;document.documentElement.style.setProperty("--accent",accent);};
  el.querySelector("#cAccR").onclick=()=>{accent="";el.querySelector("#cAccV").textContent="mặc định";document.documentElement.style.removeProperty("--accent");};
  el.querySelector("#cQr").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const m=360,sc=Math.min(1,m/Math.max(im.width,im.height));const cv=document.createElement("canvas");cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.imageSmoothingEnabled=false;x.drawImage(im,0,0,cv.width,cv.height);qr=cv.toDataURL("image/png");el.querySelector("#cQrPrev").src=qr;URL.revokeObjectURL(im.src);};im.src=URL.createObjectURL(f);};
  el.querySelector("#cQrR").onclick=()=>{qr="";el.querySelector("#cQrPrev").src=QR_IMG;};
  const read=()=>{const L=v=>v.split("\n").map(x=>x.trim()).filter(Boolean);const P=l=>l.split("|").map(x=>x.trim());const V=id=>el.querySelector("#"+id).value.trim();
    const unchecked=n=>[...el.querySelectorAll(`[data-${n}]`)].filter(x=>!x.checked).map(x=>x.dataset[n]);
    const o={notice:V("cNotice"),noticeType:V("cNType"),noticeFrom:V("cNFrom"),noticeTo:V("cNTo"),noticeLink:V("cNLink"),noticeLinkText:V("cNLinkT"),
      popup:{on:el.querySelector("#cPOn").checked,title:V("cPTitle"),text:V("cPText")},tagline:V("cTag"),bubble:V("cBubble"),accent,
      hideTiles:unchecked("tile"),hideGames:unchecked("game"),hideTopics:unchecked("topic"),
      cards:L(V("cCards")).map(P).filter(x=>x[0]),daily:L(V("cDaily")).map(P).filter(d=>d[0]),speak:L(V("cSpeak")).map(P).filter(d=>d[0]),
      donate:V("cDonate"),bookOff:!el.querySelector("#cBookOn").checked,bookText:V("cBookT"),qr,footer:V("cFooter"),email:V("cEmail"),maintenance:{on:el.querySelector("#cMOn").checked,text:V("cMText")},topics:[],grammar:[]};
    V("cTopics").split(/\n\s*\n/).forEach(b=>{const ls=L(b);if(!ls.length||!ls[0].startsWith("#"))return;const h=P(ls[0].slice(1));o.topics.push({n:h[0],k:h[1]||"",ic:h[2]||"⭐",w:ls.slice(1).map(l=>P(l).slice(0,2)).filter(w=>w[0])});});
    V("cGram").split(/\n\s*\n/).forEach(b=>{const ls=L(b);if(!ls.length||!ls[0].startsWith("##"))return;const h=P(ls[0].slice(2));o.grammar.push({g:h[0],lv:+h[1]||1,m:h[2]||"",f:h[3]||"",n:h[4]||"",ex:ls.slice(1).filter(l=>l.startsWith("=")).map(l=>P(l.slice(1)).slice(0,2))});});
    return o;};
  el.querySelector("#cSave").onclick=async e=>{const o=read();e.target.disabled=true;const m=el.querySelector("#cMsg");m.textContent="Đang lưu…";
    try{await API.cmsSet(o);applyCMS(o);try{localStorage.setItem(CMS_KEY,JSON.stringify(o));}catch(x){}el.querySelector("#cJson").value=JSON.stringify(o);m.textContent="✅ Đã lưu! Mọi người sẽ thấy khi mở lại web.";sfx("win");}catch(err){m.textContent="❌ Chưa lưu được: "+err.message;}e.target.disabled=false;};
  el.querySelector("#cPrev").onclick=()=>{applyCMS(read());home();tPop("Đây là bản xem thử. Vào lại Admin → Chỉnh nội dung để bấm Lưu nha!","wink",5000);};
  el.querySelector("#cCopy").onclick=async()=>{const t=el.querySelector("#cJson");try{await navigator.clipboard.writeText(t.value);tPop("Đã chép!","happy");}catch(e){t.select();tPop("Bấm giữ để chép nha","think");}};
  el.querySelector("#cImp").onclick=async()=>{let o;try{o=JSON.parse(el.querySelector("#cJson").value);}catch(e){return tPop("Đoạn sao lưu bị lỗi định dạng.","sad");}
    if(!await askSheet("Khôi phục nội dung?","Nội dung CMS hiện tại sẽ được thay bằng đoạn sao lưu (chưa lưu cho tới khi bấm Lưu).","Khôi phục"))return;CMS=o;adminCms(el);tPop("Đã nạp bản sao lưu, nhớ bấm Lưu nha!","wink");};
}
async function adminStats(el,q){
  try{const [s,list]=await Promise.all([API.stats(),API.codes()]);
    const today=ds(new Date());const act7=list.filter(x=>{if(!x.last)return false;const p=x.last.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);return (Date.now()-d)/864e5<=7;}).length;
    const draw=(q)=>{const f=(q||"").trim().toUpperCase();
      const rows=list.filter(x=>!f||x.code.includes(f)||x.nick.toUpperCase().includes(f)).sort((a,b)=>(b.t||0)-(a.t||0));
      el.innerHTML=`<div class="mstats">${[["🔑",list.length,"Code đã tạo"],["🔥",act7,"Học trong 7 ngày"],["💌",s.feedback??"–","Góp ý"],["🃏",ALLW.length,"Từ vựng"]].map(([i,v,t])=>`<div class="ms card"><span>${i}</span><b>${v}</b><small>${t}</small></div>`).join("")}</div>
      <h3 class="sec-h">Danh sách code</h3>
      <div class="bar"><input class="g-in sm" id="cq" placeholder="🔎 Tìm theo code hoặc tên" value="${esc(q||"")}" style="flex:1;min-width:200px"><button class="btn sm" id="cr">↻ Tải lại</button></div>
      <p class="note">Code được mã hóa khi lưu, nên code cũ chỉ hiện chữ thật sau lần người đó mở web lại. Xóa code là xóa luôn tiến trình học của code đó, không khôi phục được.</p>
      <div class="ctbl">${rows.map(x=>`<div class="crw card"><div class="cc"><b class="cd">${x.code?esc(x.code):"<span class='note'>(chưa hiện)</span>"}</b>${x.code===ADMIN_CODE?`<span class="pill">admin</span>`:""}<span class="cn">${esc(x.nick||"—")}</span></div>
        <div class="cm"><span>⭐ ${x.xp} XP · ${lvInfo(x.xp).ko}</span><span>📗 ${x.done} bài</span><span>🃏 ${x.words} từ</span><span>🕒 ${x.last?(x.last===today?"hôm nay":esc(x.last.split("-").reverse().join("/"))):"chưa học"}</span></div>
        <button class="btn sm del" data-dc="${esc(x.id)}" data-code="${esc(x.code)}" ${x.code===ADMIN_CODE||x.id===CODE_ID?"disabled":""}>🗑 Xóa</button></div>`).join("")||`<p class="note">Không có code nào.</p>`}</div>`;
      const qi=el.querySelector("#cq");let tm;qi.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{draw(qi.value);const n=el.querySelector("#cq");n.focus();n.setSelectionRange(n.value.length,n.value.length);},300);};
      el.querySelector("#cr").onclick=()=>adminStats(el,qi.value);
      el.querySelectorAll("[data-dc]").forEach(b=>b.onclick=async()=>{const nm=b.dataset.code||"này";if(!await askSheet(`Xóa code ${esc(nm)}?`,"Toàn bộ tiến trình học của code này sẽ bị xóa vĩnh viễn.","Xóa code","sad"))return;
        b.disabled=true;try{await API.delCode(b.dataset.dc);const i=list.findIndex(x=>x.id===b.dataset.dc);if(i>=0)list.splice(i,1);draw(qi.value);tPop("Đã xóa code "+esc(nm),"happy");}catch(e){b.disabled=false;tPop(esc(e.message),"sad");}});};
    draw(q);}
  catch(e){el.innerHTML=`<div class="warn">Không tải được thống kê: ${esc(e.message)}</div>`;}
}
loadCMS();

bootCode();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
