<style>
/* Layout: one narrow app column, like a pocket phrasebook — 3 tracks (giao tiếp / phát âm / ngữ pháp), each a list of lessons */
/* Pastel pink & sky blue: blush ground with soft dots, rose accent, sky-blue secondary */
:root{
  --bg:#EEF6FD; --dot:#D3E7F8; --surface:#FFFFFF; --ink:#1F2F45; --muted:#647A93; --line:#D2E3F3;
  --accent:#E05A68; --accent-soft:#FDE3E6; --hint:#3E8CCB; --hint-soft:#DCEEFC; --butter:#FFE9B8;
  --red:#B5303F; --red-soft:#FBE0E3; --good:#2E8B5B; --good-soft:#DDF2E6; --amber:#D9902B; --lav:#8A6CCB; --petal:#F6B7BE; --shadow:#CFE2F3;
  --display:"Baloo 2", "Jua", "Gowun Dodum", "Noto Sans KR", "Be Vietnam Pro", system-ui, sans-serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121C29; --dot:#1A2738; --surface:#1B2A3C; --ink:#E8F1FB; --muted:#9DB3CC; --line:#2A3E56;
  --accent:#FF8E98; --accent-soft:#4A2329; --hint:#8EC5F2; --hint-soft:#1D3247; --butter:#6E5A33;
  --red:#FF7D8A; --red-soft:#47222A; --good:#6FD39A; --good-soft:#173A28; --amber:#F2B45A; --lav:#B9A2FF; --petal:#7A3C47; --shadow:#0B121B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121C29; --dot:#1A2738; --surface:#1B2A3C; --ink:#E8F1FB; --muted:#9DB3CC; --line:#2A3E56;
  --accent:#FF8E98; --accent-soft:#4A2329; --hint:#8EC5F2; --hint-soft:#1D3247; --butter:#6E5A33;
  --red:#FF7D8A; --red-soft:#47222A; --good:#6FD39A; --good-soft:#173A28; --amber:#F2B45A; --lav:#B9A2FF; --petal:#7A3C47; --shadow:#0B121B; color-scheme:dark}

/* illustrations */
.ill{display:block;flex:none;overflow:visible}
.ill .ia{fill:var(--accent)} .ill .is{fill:var(--accent-soft)} .ill .ih{fill:var(--hint)} .ill .ihs{fill:var(--hint-soft)}
.ill .iw{fill:var(--surface)} .ill .iy{fill:var(--butter)} .ill .ikf{fill:var(--ink)}
.ill .ik,.ill .ik *{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ill .ikh{fill:none;stroke:var(--hint);stroke-width:2.6;stroke-linecap:round}
.ill .iws{fill:none;stroke:var(--surface);stroke-width:2.6;stroke-linecap:round}
.ill .isk ellipse{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2.4}
.ill .ring{fill:none;stroke:var(--accent);stroke-width:12;stroke-dasharray:13.35 13.35}
.ill .itx text{font-family:var(--display);font-weight:800;font-size:17px;fill:var(--ink);text-anchor:middle}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 2px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fr{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
p{margin:0}

header.hero{background:var(--accent-soft);border-radius:26px;padding:20px 20px 0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.themebar{align-self:flex-end;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:4px}
.themebar button{border:0;background:none;border-radius:999px;padding:5px 10px;font-size:.78rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
.themebar svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.themebar button[aria-checked="true"]{background:var(--accent);color:var(--surface)}
.hero-art{width:100%;max-width:340px;height:auto;margin:6px auto 0;aspect-ratio:300/140}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1;margin:0;letter-spacing:-.03em}
h1 span{color:var(--accent)}
.sub{color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}

.daily{background:var(--accent);color:var(--surface);border:0;border-radius:20px;padding:12px 14px 12px 18px;box-shadow:0 6px 0 var(--line);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px}
.daily b{display:block;font-size:1.05rem}
.daily small{opacity:.85}
.daily .ill .ik,.daily .ill .ik *{stroke:var(--ink)}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 2px;font-size:.88rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.seg button small{font-weight:500;font-size:.72rem;font-variant-numeric:tabular-nums}
.seg button{gap:2px}
.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.track-note{font-size:.88rem;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.lesson{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 14px 10px 10px}
.lesson:hover{border-color:var(--accent)}
.tile{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center}
.list li:nth-child(even) .tile{background:var(--hint-soft)}
.bn{display:block;font-size:.72rem;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.08em}
.lesson .t{min-width:0}
.lesson .t .fr{font-size:1.12rem;display:block}
.lesson .t small{color:var(--muted)}
.chip{font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.chip.try{background:var(--red-soft);color:var(--red)}

.back{background:none;border:0;color:var(--muted);padding:0;font-weight:600;align-self:flex-start}
.kicker{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hint)}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.lhead>div{min-width:0}
.lart{width:76px;height:76px;border-radius:22px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.lhead h2{font-family:var(--display);font-weight:800;font-size:2rem;margin:2px 0 0;line-height:1.1;text-wrap:balance}
.lhead p{margin-top:4px;color:var(--muted)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}

.stack{display:flex;flex-direction:column;gap:12px}
.tip{background:var(--hint-soft);border-radius:18px;padding:12px 14px;font-size:.93rem}
.tip b{color:var(--hint)}
.note{font-size:.85rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.phrase{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.phrase .fr{font-size:1.3rem;line-height:1.25;min-width:0}
.pr{color:var(--hint);font-size:.9rem;font-weight:500}
.vi{color:var(--muted);font-size:.95rem}
.phrase .btns{grid-row:1 / span 3;grid-column:2;display:flex;flex-direction:column;gap:6px}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0;flex:none}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.slow{font-size:.7rem;font-weight:700;color:var(--muted)}
.icon.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.icon.sm{width:34px;height:34px}
.icon.sm svg{width:16px;height:16px}

/* sound cards */
.sound{display:flex;flex-direction:column;gap:10px}
.sound-top{display:flex;align-items:center;gap:12px}
.sym{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;color:var(--accent);min-width:0}
.ipa{font-size:.85rem;color:var(--muted);font-weight:500}
.how{font-size:.95rem}
.vn{font-size:.9rem;color:var(--hint);font-weight:500}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;text-align:left;display:flex;flex-direction:column;line-height:1.2}
.word .fr{font-size:1.05rem}
.word small{color:var(--muted);font-size:.75rem}
.playing{outline:2px solid var(--red)!important}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pair{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.pair button{flex:1;border:0;background:none;padding:10px 6px;font-family:var(--display);font-weight:700;font-size:1.05rem}
.pair button+button{border-left:1px solid var(--line)}
.pair button:active{background:var(--accent-soft)}

/* grammar */
.g h3{font-family:var(--display);font-weight:800;font-size:1.2rem;margin:4px 0 0}
.g .txt{font-size:.98rem}
.g .txt b{color:var(--accent)}
.g .txt i{font-family:var(--display);font-style:normal;font-weight:700}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft)}
td.f{font-family:var(--display);font-weight:700;font-size:1.02rem}
tr.say{cursor:pointer}
tr.say:hover td{background:var(--accent-soft)}
tr.say td:last-child{width:1%;white-space:nowrap;color:var(--muted)}
.exs{display:flex;flex-direction:column;gap:6px}
.exr{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.exr span{display:flex;flex-direction:column;min-width:0}
.exr .fr{font-size:1.05rem}
.exr small{color:var(--muted)}
.trap{border:2px dashed var(--accent);background:var(--surface);border-radius:18px;padding:12px 14px;font-size:.93rem}
.trap b:first-child{color:var(--accent)}

.dlg{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);box-shadow:0 3px 0 var(--line)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.line{display:flex;flex-direction:column;max-width:86%;gap:2px}
.line.A{align-self:flex-start}
.line.B{align-self:flex-end;align-items:flex-end}
.who{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.bubble{text-align:left;border-radius:16px;padding:10px 14px;background:var(--surface);border:1px solid var(--line)}
.B .bubble{background:var(--accent-soft);border-color:transparent}
.bubble .fr{font-size:1.1rem;display:block}
.bubble small{color:var(--muted)}
.bubble.hide .fr,.bubble.hide .rj{filter:blur(7px);user-select:none}
.rj{display:block;color:var(--hint);font-size:.82rem;font-weight:500}
.jp-sub{color:var(--accent);font-size:1.05rem;margin-top:-2px}

.quiz{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qask{font-size:.9rem;color:var(--muted)}
.qprompt{font-size:1.45rem;line-height:1.3;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:500}
.opt.fr{font-size:1.08rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.fb{font-weight:600}
.fb.ok{color:var(--good)} .fb.no{color:var(--red)}
.explain{font-size:.92rem;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px}
.result{text-align:center;align-items:center}
.big{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.warn{background:var(--red-soft);border-radius:12px;padding:10px 14px;font-size:.9rem}
footer{color:var(--muted);font-size:.8rem;text-align:center}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.Lbig{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;width:52px;height:62px;font-size:1.9rem;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none}
.Lbig small{font-size:.85rem;font-weight:700;font-family:var(--body)}
.linfo{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.84rem;line-height:1.35}
.lname b{color:var(--red);font-size:.95rem}
.lsound{color:var(--muted)}
.lex{border:0;background:none;padding:0;text-align:left;margin-top:2px}
.lex .fr{font-size:1rem;text-decoration:underline dotted var(--accent);text-underline-offset:3px}
.lex small{color:var(--muted)}
table.grid th,table.grid td{padding:4px;text-align:center;border-bottom:0}
table.grid thead th{font-family:var(--display);font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--accent);background:none}
.syl{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:46px;padding:6px 4px;font-size:1rem}
.syl:hover{border-color:var(--accent)}
.rowbtn{border:0;background:var(--accent);color:var(--surface);border-radius:8px;padding:6px 8px;font-weight:700;font-family:var(--display);white-space:nowrap}
.splitrow{display:flex;flex-direction:column;gap:8px;padding:12px}
.chunks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chunk{border:0;background:var(--accent-soft);border-radius:8px;padding:4px 10px;font-size:1.1rem}
.dot{color:var(--muted)}
.whole{display:flex;gap:10px;align-items:center}
.whole>span{display:flex;flex-direction:column;min-width:0}
.whole .fr{font-size:1.1rem}
.whole small{color:var(--muted)}

/* ---------- v2: sakura + matcha app shell ---------- */
.kl{font-family:"Gowun Dodum","Noto Sans KR",var(--display);font-weight:700}
.wrap{padding-block:20px 112px}
header.hero{position:relative;background:linear-gradient(168deg,var(--hint-soft) 0%,var(--hint-soft) 55%,var(--accent-soft) 100%);box-shadow:0 4px 0 var(--shadow)}
.hero>*:not(.petals){position:relative;z-index:1}
.petals{position:absolute;inset:0;pointer-events:none;z-index:0}
.petals i{position:absolute;top:-14px;width:11px;height:9px;background:var(--petal);border-radius:80% 0 80% 0;opacity:.85;animation:fall 10s linear infinite}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0deg)}50%{transform:translate(18px,170px) rotate(160deg)}100%{transform:translate(-6px,360px) rotate(320deg);opacity:0}}
.pbar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--hint));transition:width .4s}
.hero-bar{margin-top:6px}
.card,.lesson,.quiz,.lhead,.seg,.tabs{box-shadow:0 3px 0 var(--shadow)}
.seg button[aria-selected="true"]{background:var(--hint-soft);color:var(--hint);box-shadow:inset 0 0 0 2px var(--hint)}
.seg.two{grid-template-columns:1fr 1fr}
.seg.two button{padding:10px 4px;font-size:1rem}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--accent),#EE7C86)}
.daily{background:linear-gradient(120deg,var(--accent),#EE7C86)}
.daily.soft{background:var(--hint-soft);color:var(--ink);box-shadow:0 4px 0 var(--shadow)}
.daily.soft small{color:var(--muted);opacity:1}
.btn.matcha{background:var(--hint);border-color:var(--hint);color:var(--surface)}
.bar.center{justify-content:center}
.sec-h{font-family:var(--display);font-weight:800;font-size:1.2rem;margin:6px 0 -6px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:6px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tabbar button{flex:1;max-width:160px;border:0;background:none;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:700;color:var(--muted)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.tabbar .nv{font-size:1.25rem;line-height:22px;height:22px}
.tabbar button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
/* kana chart */
.kchart{padding:8px;overflow-x:auto}
.kchart table{width:100%;border-collapse:separate;border-spacing:5px}
.kchart th{background:none;color:var(--hint);font-family:var(--display);font-size:.9rem;text-transform:none;letter-spacing:0;padding:0;text-align:center;border:0;width:24px}
.kchart td{padding:0;border:0}
.kcell{width:100%;aspect-ratio:1/1.08;min-width:46px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;line-height:1}
.kcell .kl{font-size:1.75rem}
.kcell small{font-size:.7rem;color:var(--muted);font-weight:600;margin-top:3px}
.kcell:hover{border-color:var(--accent);background:var(--accent-soft)}
.kcell.done{background:var(--hint-soft);border-color:var(--hint)}
.kcell.done::after{content:"✓";position:absolute;top:3px;right:5px;font-size:.62rem;color:var(--hint);font-weight:800}
.progress{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.progress .pbar{background:var(--line)}
.pg-row{display:flex;justify-content:space-between;font-size:.9rem}
.pg-row span{color:var(--hint);font-weight:700}
.confuse{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cf{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cf-pair{display:flex;align-items:center;gap:8px}
.cf-pair button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;width:46px;height:46px;font-size:1.6rem;line-height:1}
.cf-pair span{color:var(--muted);font-size:.75rem}
.cf p{font-size:.8rem;color:var(--muted);line-height:1.4}
/* letters pen button */
.letter{position:relative}
.penbtn{position:absolute;right:8px;bottom:8px;border:0;background:var(--hint-soft);color:var(--hint);border-radius:999px;padding:3px 9px;font-size:.8rem;font-weight:700;display:flex;gap:3px;align-items:center}
.letter .linfo{padding-bottom:22px}
/* writer sheet */
body.lock{overflow:hidden}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(16,28,44,.45);display:flex;align-items:flex-end;justify-content:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px));animation:fadein .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:100%;overflow-y:auto;border-radius:26px 26px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:slideup .28s ease-out}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:26px;max-height:92%}}
.sh-top{display:flex;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--bg);padding:6px 0;z-index:2}
.sh-title{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.sh-ch{font-size:3.2rem;line-height:1;color:var(--accent);background:var(--accent-soft);border-radius:18px;width:72px;height:72px;display:grid;place-items:center}
.sh-meta{display:flex;flex-direction:column}
.sh-meta b{font-family:var(--display);font-size:1.5rem;line-height:1.1}
.sh-meta small{color:var(--muted)}
.sh-x{border:0;background:var(--surface);border-radius:50%;width:40px;height:40px;font-size:1.5rem;line-height:1;color:var(--muted);box-shadow:0 2px 0 var(--shadow)}
.sh-sec{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 0 var(--shadow)}
.sh-sec h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.15rem}

.sh-nav{display:flex;justify-content:space-between;gap:8px}
.sh-nav .btn{font-family:var(--display);font-size:1rem}
.pad{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto;background:var(--bg);border-radius:18px}
.pad svg{position:absolute;inset:0;width:100%;height:100%}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;border-radius:18px}
.pad.mini{width:110px;flex:none}
.pg-box{fill:none;stroke:var(--accent);stroke-width:1.2;opacity:.55}
.pg-cross{fill:none;stroke:var(--accent);stroke-width:.7;stroke-dasharray:3 3;opacity:.5}
.anim .st{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1}
.anim .lbl circle{stroke:var(--surface);stroke-width:1.2}
.anim .lbl text{font:700 7px var(--body);fill:#fff;text-anchor:middle}
.anim .lbl{transition:opacity .2s}
.ghost .gs{fill:none;stroke:var(--line);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.ghost .gnum{font:700 6px var(--body);fill:var(--muted)}
.ghost.off .gs,.ghost.off .gnum{display:none}
.gk{font-size:84px;text-anchor:middle;fill:var(--line)}
.gk.dark{fill:var(--ink);opacity:.8}
.gk.sm{font-size:46px}
/* rules lesson visuals */
.scripts,.ends{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc,.end{padding:12px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.sc .kl{font-size:2.4rem;line-height:1.1;color:var(--accent)}
.sc:nth-child(2) .kl{color:var(--hint)}
.sc:nth-child(3) .kl{color:var(--amber)}
.sc small,.end small{color:var(--muted);font-size:.78rem;line-height:1.35}
.end svg{width:54px;height:72px}
.end .pen{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.end .taper{fill:var(--ink)}
.end b{font-size:1.15rem}
@media (max-width:420px){.scripts,.ends{grid-template-columns:1fr}.sc,.end{flex-direction:row;text-align:left;gap:10px}.sc small,.end small{flex:1}.end svg{width:40px;height:54px}}
.genko{display:flex;gap:14px;align-items:center}
@media (max-width:420px){.genko{flex-direction:column}}
table.cmp th,table.cmp td{text-align:center;padding:8px 6px}
table.cmp td{font-size:1.9rem;line-height:1.2}
table.cmp td.pf{font-family:"Gowun Dodum","Noto Sans KR",sans-serif;font-weight:500}
table.cmp tbody th{background:var(--accent-soft);color:var(--accent);font-size:.75rem;white-space:nowrap}
.boxes{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.boxes small{display:block;text-align:center;color:var(--muted);font-size:.78rem;margin-top:6px}
.pair2{display:grid;grid-template-columns:110px 110px;gap:2px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.petals{display:none}}

/* code gate */
.gating .tabbar{display:none}
.gate{max-width:460px;margin:0 auto;padding:28px 4px 40px;text-align:center}
.gate .g-art{width:min(300px,86%);margin:0 auto 6px;display:block}
.gate h1{font-family:var(--display);font-size:2rem;line-height:1.1;margin:4px 0 2px;color:var(--accent)}
.gate h2{font-family:var(--display);font-size:1.35rem;margin:18px 0 6px;color:var(--ink)}

.g-card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px;text-align:left;box-shadow:0 3px 0 var(--line)}

.g-code{display:flex;justify-content:center;gap:6px;margin:6px 0 12px}
.g-code span{width:46px;height:58px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font:800 1.9rem/58px var(--display);text-align:center}
.g-code span.d{background:var(--hint-soft);color:var(--hint)}
.g-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.g-chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}

.pill.codep{cursor:pointer;border:0;font:inherit;display:inline-flex;align-items:center;gap:6px}

.codep .sd.wait{background:var(--amber,#D9902B)} .codep .sd.err{background:var(--red)}
.codep.none{background:var(--accent);color:#fff}

function strokeLayer(ch,mode){
  const s=strokesOf(ch); if(!s)return "";

  const tf=s.extra.length?' transform="translate(0 8) scale(.86)"':"";
  let g1="",g2="",labels="";
  const placed=[];
  all.forEach((x,i)=>{
    const m=x.d.match(/M\s*([\d.]+)[ ,]+([\d.]+)/);let lx=+m[1],ly=+m[2];
    if(x.base&&tf){lx=lx*.86;ly=ly*.86+8;}
    while(placed.some(p=>Math.hypot(p[0]-lx,p[1]-ly)<9)){lx+=8;ly+=3;}
    placed.push([lx,ly]);
    const col=STC[i%4];
    const path=`<path d="${x.d}" pathLength="1" class="${mode==="ghost"?"gs":"st"}" data-i="${i}" style="${mode==="ghost"?"":`stroke:${col}`}"/>`;

  const bg=document.createElement("div");bg.className="sheet-bg";bg.id="sheet";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Cách viết chữ ${ch}">
    <div class="sh-top">
      <div class="sh-title"><span class="kl sh-ch">${ch}</span><span class="sh-meta"><b>${ROM[ch]||""}</b><small>${isV?"Nguyên âm":"Phụ âm"} · ${n} nét${JNAME[ch]?" · tên “"+JNAME[ch]+"”":""}</small></span></div>
      <button class="icon on" id="sh-say" aria-label="Nghe">${ICON}</button>
      <button class="sh-x" id="sh-x" aria-label="Đóng">×</button>
    </div>
    <section class="sh-sec">
      <h3>Thứ tự nét</h3>
      <div class="pad"><svg class="anim" id="sh-anim" viewBox="-4 -4 108 108">${GRID_SVG}${strokeLayer(ch,"anim")}</svg></div>
      <div class="bar center"><button class="btn primary" id="sh-play">▶ Xem lại</button><button class="btn" id="sh-step">Từng nét <span id="sh-stepn"></span></button><button class="btn" id="sh-slow" aria-pressed="false">Chậm</button></div>
      <p class="sh-tip">${esc(tip)}</p>
      ${ex?`<button class="exr" id="sh-ex"><span class="icon sm" aria-hidden="true">${ICON}</span><span><span class="fr">${esc(ex[0])}</span><small>${esc(ex[1])}</small></span></button>`:""}
    </section>
    <section class="sh-sec">
      <h3>Tập viết</h3>
      <p class="note">Tô theo nét mẫu mờ bằng ngón tay hoặc chuột, đúng thứ tự số. Tập 3 lần rồi tắt mẫu mờ để tự viết.</p>
      <div class="pad practice"><svg class="ghost" id="sh-ghost" viewBox="-4 -4 108 108">${GRID_SVG}${strokeLayer(ch,"ghost")}</svg><canvas id="sh-cv" aria-label="Ô tập viết"></canvas></div>
      <div class="bar center"><button class="btn" id="cv-clear">Xóa</button><button class="btn" id="cv-ghost" aria-pressed="true">Mẫu mờ: bật</button><button class="btn matcha" id="cv-done">${done?"✓ Đã tập":"Đánh dấu đã tập"}</button></div>
    </section>
    <div class="sh-nav">${prev?`<button class="btn" data-go="${prev}">← ${prev}</button>`:"<span></span>"}${next?`<button class="btn" data-go="${next}">${next} →</button>`:"<span></span>"}</div>
  </div>`;
  document.body.appendChild(bg);document.body.classList.add("lock");
  const $=id=>bg.querySelector("#"+id);
  const svg=$("sh-anim");let slow=false,stepN=0;
  const total=n;
  const play=()=>{stepN=0;$("sh-stepn").textContent="";animate(svg,slow);};
  setTimeout(play,250);
  $("sh-play").onclick=play;
  $("sh-step").onclick=()=>{if(stepN>=total)stepN=0;animToken++;
    const paths=[...svg.querySelectorAll("path.st")],lbls=[...svg.querySelectorAll(".lbl")];
    paths.forEach((p,i)=>{p.getAnimations&&p.getAnimations().forEach(a=>a.cancel());p.style.opacity=i<=stepN?"1":"0";p.style.strokeDashoffset=i<stepN?"0":"1";});
    lbls.forEach((l,i)=>l.style.opacity=i<=stepN?"1":"0");
    const p=paths[stepN];
    if(p&&p.animate&&!reduceMotion()){let len=60;try{len=p.getTotalLength();}catch(e){}const a=p.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:Math.max(380,len*(slow?16:8)),easing:"ease-in-out",fill:"forwards"});a.onfinish=()=>p.style.strokeDashoffset="0";}else if(p)p.style.strokeDashoffset="0";
    stepN++;$("sh-stepn").textContent=`${stepN}/${total}`;};
  $("sh-slow").onclick=e=>{slow=!slow;e.currentTarget.setAttribute("aria-pressed",slow);play();};
  $("sh-say").onclick=()=>speak(ch,.7);
  if($("sh-ex"))$("sh-ex").onclick=()=>speak(ex[0],.8);

  // practice canvas
  const cv=$("sh-cv"),ghost=$("sh-ghost");
  const ctx=cv.getContext("2d");let drawing=false,last=null;
  const fit=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=Math.max(6,r.width*.055);ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#333";};
  requestAnimationFrame(fit);
  const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  cv.onpointerdown=e=>{drawing=true;last=pos(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(last[0]+.1,last[1]+.1);ctx.stroke();};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p;};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false;};

  bg._key=e=>{if(e.key==="Escape")closeWriter();};
  document.addEventListener("keydown",bg._key);
  $("sh-x").focus({preventScroll:true});
}
function closeWriter(quiet){

function streak(){const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(ds(d)))d.setDate(d.getDate()-1);while(set.has(ds(d))){n++;d.setDate(d.getDate()-1);}return n;}

const NOVELTY_RE=/eddy|\bflo\b|grandma|grandpa|\breed\b|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|kathy|\bfred\b|ralph/i;
const OLD_RE=/grandma|grandpa/i;
const MALE_RE=/thomas|henri|\bpaul\b|claude|daniel|nicolas|jacques|antoine|\bjean\b|r[ée]my|mathieu|louis|fabrice|alain|guillaume|g[ée]rard|\byves\b|otoya|hattori|ichiro|keita|daichi|naoki|minsu|injoon|hyunsu|bongjin|gookmin|jinho|eddy|\breed\b|rocko|grandpa|\bmale\b|homme|男性/i;
const FEMALE_RE=/am[ée]lie|audrey|aur[ée]lie|marie|virginie|julie|hortense|denise|c[ée]line|chantal|[ée]lo[iï]se|brigitte|vivienne|jos[ée]phine|juliette|charlotte|coralie|ariane|sylvie|yvette|jacqueline|google|kyoko|o-?ren|haruka|ayumi|sayaka|nanami|mayu|\baoi\b|shiori|yuna|sora|sunhi|heami|seoyeon|jimin|yujin|\bflo\b|sandy|shelley|grandma|female|femme|女性/i;
const vGender=v=>FEMALE_RE.test(v.name)?"f":MALE_RE.test(v.name)?"m":"?";
const vRank=v=>(OLD_RE.test(v.name)?20:NOVELTY_RE.test(v.name)?10:0)+(/^ko[-_]KR/i.test(v.lang)?0:3)+(/premium|enhanced|n[âa]ng cao|natural/i.test(v.name)?-1:0);
function langVoices(){if(!hasTTS)return [];return speechSynthesis.getVoices().filter(x=>/^ko/i.test(x.lang)).sort((a,b)=>vRank(a)-vRank(b));}
function voicePick(){
  const vs=langVoices();
  if(S.voiceName){const v=vs.find(x=>x.name===S.voiceName);if(v)return {v,p:1,fake:false};}
  const want=S.voice==="m"?"m":"f";
  const hit=vs.find(v=>vGender(v)===want&&!OLD_RE.test(v.name));
  if(hit)return {v:hit,p:1,fake:false};
  const base=vs.find(v=>vGender(v)==="?"&&!NOVELTY_RE.test(v.name))||vs.find(v=>!NOVELTY_RE.test(v.name))||vs[0]||null;
  if(!base)return {v:null,p:want==="m"?.7:1.15,fake:true};
  const g=vGender(base);
  return {v:base,p:want==="m"?(g==="m"?1:.7):(g==="f"?1:1.3),fake:g!==want};
}

function clean(t){return t.replace(/\([^)]*\)/g,"").replace(/\b[AB]:\s*/g,"").replace(/[«»…–〜]/g," ").replace(/→/g,"、").replace(/ \/ /g,", ");}
function speakLocal(t,rate,onend){
  t=jamoSay(t);
  if(!hasTTS){onend&&onend();return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(clean(t));u.lang="ko-KR";{const vp=voicePick();if(vp.v)u.voice=vp.v;u.pitch=vp.p;}u.rate=rate||.9;

}
function speakSeq(list,rate,els){
  if(!hasTTS)return;let k=0;
  const step=()=>{(els||[]).forEach(e=>e.classList.remove("playing"));if(k>=list.length)return;
    if(els&&els[k])els[k].classList.add("playing");const x=list[k];speak(typeof x==="string"?x:x.t,typeof x==="string"?rate:x.r,()=>{k++;setTimeout(step,300);});};
  step();
}

/* ===================== QUIZ BUILDERS ===================== */
function qComm(i,A){
  A=A||L;const l=A[i],pool=l.p,allP=A.flatMap(x=>x.p),allB=A.flatMap(x=>x.d.filter(d=>d[0]==="B"));
  const replies=[];l.d.forEach((x,k)=>{const n=l.d[k+1];if(x[0]==="A"&&n&&n[0]==="B")replies.push({q:x,a:n});});
  const used=new Set();
  const pickP=()=>{const c=shuffle(pool).find(p=>!used.has(p[0]))||rnd(pool);used.add(c[0]);return c;};
  const dis=(right,f)=>{const seen=new Set([right[f]]),out=[];for(const x of shuffle(pool).concat(shuffle(allP))){if(!seen.has(x[f])){seen.add(x[f]);out.push(x[f]);}if(out.length===3)break;}return out;};
  return shuffle(["listen","listen","vi2fr","vi2fr","fr2vi","fr2vi","reply","reply"]).map(t=>{
    if(t==="reply"&&replies.length){const r=rnd(replies);const seen=new Set([r.a[1]]),o=[];for(const x of shuffle(allB)){if(!seen.has(x[1])){seen.add(x[1]);o.push(x[1]);}if(o.length===3)break;}
      return {ask:"Người ta nói câu này. Bạn đáp sao cho hợp?",prompt:r.q[1],promptFr:true,sub:r.q[2],speakText:r.q[1],ans:r.a[1],opts:shuffle([r.a[1],...o]),fr:true,after:r.a[1]};}
    if(t==="listen"&&hasTTS){const p=pickP();return {ask:"Nghe rồi chọn nghĩa đúng",listen:true,speakText:p[0],reveal:p[0],ans:p[2],opts:shuffle([p[2],...dis(p,2)])};}
    if(t==="fr2vi"){const p=pickP();return {ask:"Câu này nghĩa là gì?",prompt:p[0],promptFr:true,speakText:p[0],ans:p[2],opts:shuffle([p[2],...dis(p,2)])};}
    const p=pickP();return {ask:"Nói câu này bằng tiếng Hàn thế nào?",prompt:p[2],ans:p[0],opts:shuffle([p[0],...dis(p,0)]),fr:true,after:p[0]};
  });
}
function qSound(i){
  const l=P[i],qs=[];
  const words=l.items.flatMap((it,k)=>it.w.map(w=>({w:w[0],k})));
  // listen & pick between a confusing pair
  for(const p of shuffle(l.pairs).slice(0,5)){const a=rnd(p);
    qs.push({ask:"Nghe kỹ. Người ta vừa đọc từ nào?",listen:true,speakText:a,ans:a,opts:shuffle(p.slice()),fr:true,reveal:null,explain:`Hai từ: <b>${esc(p[0])}</b> và <b>${esc(p[1])}</b>. Bấm loa để nghe lại.`});}
  // listen & pick spelling among 4 words
  for(let n=0;n<2;n++){const a=rnd(words);const o=shuffle(words.filter(x=>x.w!==a.w)).slice(0,3).map(x=>x.w);
    qs.push({ask:"Nghe rồi chọn từ đúng",listen:true,speakText:a.w,ans:a.w,opts:shuffle([a.w,...o]),fr:true});}
  // which sound (not alphabet)
  if(!l.alpha&&l.items.length>1){const a=rnd(words);const right=l.items[a.k].sym;const o=shuffle(l.items.filter((_,k)=>k!==a.k).map(x=>x.sym)).slice(0,2);
    qs.push({ask:"Từ này chứa âm nào trong bài?",prompt:a.w,promptFr:true,speakText:a.w,ans:right,opts:shuffle([right,...o]),fr:true,explain:esc(l.items[a.k].how)});}
  while(qs.length<8){const a=rnd(words);const o=shuffle(words.filter(x=>x.w!==a.w)).slice(0,3).map(x=>x.w);
    qs.push({ask:"Nghe rồi chọn từ đúng",listen:true,speakText:a.w,ans:a.w,opts:shuffle([a.w,...o]),fr:true});}
  if(!hasTTS) return qs.filter(q=>!q.listen).concat(gFallback(l)).slice(0,8);
  return shuffle(qs).slice(0,8);
}
function gFallback(l){ // no audio: read word -> which sound
  const words=l.items.flatMap((it,k)=>it.w.map(w=>({w:w[0],k})));
  return Array.from({length:8},()=>{const a=rnd(words);const right=l.items[a.k].sym;const o=shuffle(l.items.filter((_,k)=>k!==a.k).map(x=>x.sym)).slice(0,3);
    return {ask:"Từ này thuộc nhóm âm nào?",prompt:a.w,promptFr:true,ans:right,opts:shuffle([right,...o]),fr:true,explain:esc(l.items[a.k].how)};});
}
function qGram(i,A){return qGramL((A||G)[i]);}
function qGramL(l){
  return shuffle(l.q).map(x=>{
    if(Array.isArray(x)){const [s,o,a,e]=x;const ans=o[a];
      const full=s.replace(/\(.*?\)/g,"").replace("___",ans).replace(/' /g,"'");
      return {ask:"Chọn đáp án đúng để điền vào chỗ trống",prompt:s,blank:true,promptFr:true,ans,opts:shuffle(o.slice()),fr:true,after:/[\uac00-\ud7a3]/.test(full)?full.replace(/[（(][^)）]*[)）]/g,""):null,explain:esc(e)};}
    return {ask:x.ask,ans:x.o[x.a],opts:shuffle(x.o.slice()),fr:/[\uac00-\ud7a3]/.test(x.o[x.a]),after:/[\uac00-\ud7a3]/.test(x.o[x.a])?x.o[x.a]:null,explain:esc(x.e)};
  });
}

function qFound(i){
  const l=N[i],b=l.b,gens=[];
  const letters=b.filter(x=>x.letters).flatMap(x=>x.letters);
  const words=b.filter(x=>x.items).flatMap(x=>x.items.flatMap(it=>it.w.map(w=>w[0])));
  const pairs=b.filter(x=>x.pairs).flatMap(x=>x.pairs);
  const grids=b.filter(x=>x.grid).flatMap(x=>x.grid.rows).map(([r,c])=>[r,c.filter(Boolean)]).filter(r=>r[1].length>=2);
  const splits=b.filter(x=>x.split).flatMap(x=>x.split);
  const four=(arr,right)=>shuffle([right,...shuffle([...new Set(arr)].filter(x=>x!==right)).slice(0,3)]);
  if(letters.length){
    gens.push({a:1,f:()=>{const x=rnd(letters);return {ask:"Nghe rồi chọn chữ đúng",listen:true,speakText:x[0],rate:.7,ans:x[0],opts:four(letters.map(y=>y[0]),x[0]),fr:true};}});
    gens.push({f:()=>{const x=rnd(letters);return {ask:"Chữ này đọc là gì?",prompt:x[0],promptFr:true,ans:x[1],opts:four(letters.map(y=>y[1]),x[1]),after:x[0]};}});
    const ex=letters.map(y=>y[3]);gens.push({a:1,f:()=>{const w=rnd(ex);return {ask:"Nghe rồi chọn từ đúng",listen:true,speakText:w,rate:.8,ans:w,opts:four(ex,w),fr:true};}});gens.push({f:()=>{const x=rnd(letters);return {ask:"Từ này đọc thế nào?",prompt:x[3],promptFr:true,speakText:x[3],ans:x[4].split(" · ")[0],opts:four(letters.map(y=>y[4].split(" · ")[0]),x[4].split(" · ")[0])};}});
  }
  if(words.length>=4)gens.push({a:1,f:()=>{const w=rnd(words);return {ask:"Nghe rồi chọn từ đúng",listen:true,speakText:w,ans:w,opts:four(words,w),fr:true};}});
  const its=b.filter(x=>x.items).flatMap(x=>x.items);
  if(its.length>1)gens.push({f:()=>{const k=Math.random()*its.length|0,w=rnd(its[k].w)[0];const right=its[k].sym;return {ask:"Từ này thuộc nhóm âm nào trong bài?",prompt:w,promptFr:true,speakText:w,ans:right,opts:four(its.map(x=>x.sym),right),fr:true,explain:esc(its[k].how)};}});
  if(pairs.length)gens.push({a:1,f:()=>{const p=rnd(pairs),a=rnd(p);return {ask:"Nghe kỹ. Người ta vừa đọc từ nào?",listen:true,speakText:a,ans:a,opts:shuffle(p.slice()),fr:true};}});
  if(grids.length)gens.push({a:1,f:()=>{const r=rnd(grids),c=rnd(r[1]);return {ask:"Nghe rồi chọn âm đúng",listen:true,speakText:c,rate:.7,ans:c,opts:four(r[1],c),fr:true};}},{a:1,f:()=>{const r=rnd(grids),c=rnd(r[1]);return {ask:"Nghe rồi chọn âm đúng",listen:true,speakText:c,rate:.7,ans:c,opts:four(r[1],c),fr:true};}});
  if(splits.length&&!l.sentences){
    gens.push({f:()=>{const s=rnd(splits);const n=String(s[0].length);const o=shuffle(["1","2","3","4","5"].filter(x=>x!==n)).slice(0,2);return {ask:"Từ này có mấy âm tiết (mấy khúc đọc)?",prompt:s[1],promptFr:true,speakText:s[1],ans:n,opts:[n,...o].sort(),explain:"Chia ra: <b>"+esc(s[0].join(" · "))+"</b>"};}});
    gens.push({a:1,f:()=>{const s=rnd(splits);return {ask:"Nghe rồi chọn từ đúng",listen:true,speakText:s[1],ans:s[1],opts:four(splits.map(x=>x[1]),s[1]),fr:true};}});
  }
  if(l.sentences){
    gens.push({a:1,f:()=>{const s=rnd(splits);return {ask:"Nghe câu rồi chọn câu đúng",listen:true,speakText:s[1],ans:s[1],opts:four(splits.map(x=>x[1]),s[1]),fr:true};}});
    gens.push({f:()=>{const s=rnd(splits);return {ask:"Câu này nghĩa là gì?",prompt:s[1],promptFr:true,speakText:s[1],ans:s[2],opts:four(splits.map(x=>x[2]),s[2])};}});
  }
  const g=shuffle(hasTTS?gens:gens.filter(x=>!x.a));
  const qs=[],seen=new Set();let k=0,tries=0;
  while(qs.length<8&&g.length&&tries<60){const q=g[k%g.length].f();k++;tries++;const id=q.ask+q.ans;if(seen.has(id)&&tries<50)continue;seen.add(id);qs.push(q);}
  return shuffle(qs);
}
const QB={n:i=>N[i].q?qGramL(N[i]):qFound(i),s:qSound,g:qGram,c:qComm,h:i=>qGram(i,G3),d:i=>qComm(i,C3),j:i=>qGram(i,G4),e:i=>qComm(i,C4),k:i=>qGram(i,G5),f:i=>qComm(i,C5)};

/* ===================== QUIZ UI ===================== */
function quiz(el,qs,key){
  let n=0,score=0;const N=qs.length;
  const draw=()=>{
    if(n>=N)return finish();
    const q=qs[n];
    const prompt=q.blank?esc(q.prompt).replace("___",'<span class="blank">?</span>'):esc(q.prompt||"");
    el.innerHTML=`<div class="quiz">
      <div class="qtop"><span>Câu ${n+1}/${N}</span><span>Đúng ${score}</span></div>
      <div class="prog"><i style="width:${n/N*100}%"></i></div>
      <p class="qask">${q.ask}</p>
      ${q.listen?`<div class="bar"><button class="icon on" id="play" aria-label="Nghe lại">${ICON}</button><button class="icon slow" id="playS" aria-label="Nghe chậm">chậm</button></div>`:
        (q.prompt?`<p class="qprompt ${q.promptFr?"fr":""}"><span>${prompt}</span>${q.speakText?`<button class="icon sm" id="play" aria-label="Nghe">${ICON}</button>`:""}</p>`:"")}
      ${q.blank&&RJon()&&rj(q.prompt)?`<p class="qrj">${esc(rj(q.prompt).replace(/_+/g,"___"))}</p>`:""}${q.sub?`<p class="note">${esc(q.sub)}</p>`:""}
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt ${q.fr?"fr":""}" data-k="${k}">${esc(o)}</button>`).join("")}</div>
      <div id="fbx" class="stack"></div></div>`;
    const pl=document.getElementById("play"),ps=document.getElementById("playS");
    if(pl)pl.onclick=()=>speak(q.speakText,q.rate||.85);
    if(ps)ps.onclick=()=>speak(q.speakText,.55);
    if(q.listen)setTimeout(()=>speak(q.speakText,q.rate||.85),250);
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=q.opts[b.dataset.k]===q.ans;if(ok)score++;sfx(ok?"ok":"no");
      el.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.opts[x.dataset.k]===q.ans)x.classList.add("right");});
      if(!ok)b.classList.add("wrong");
      if(q.blank){const bl=el.querySelector(".blank");if(bl)bl.textContent=q.ans;}
      const fbx=document.getElementById("fbx");
      fbx.innerHTML=`<p class="fb ${ok?"ok":"no"}">${ok?"Chuẩn!":"Chưa đúng."} ${q.reveal?`Câu vừa nghe: <span class="fr">${esc(q.reveal)}</span>`:""}</p>
        ${q.explain?`<p class="explain">${q.explain}</p>`:""}
        <button class="btn primary" id="nq">${n+1<N?"Câu tiếp →":"Xem kết quả"}</button>`;
      if(q.after)speak(q.after,.85);else if(!ok&&q.listen)speak(q.speakText,.7);
      const nb=document.getElementById("nq");nb.onclick=()=>{n++;draw();};nb.focus({preventScroll:true});
    });
  };
  const finish=()=>{
    markDay();
    const pass=score>=Math.ceil(N*.75);
    {const first=key&&pass&&!S.done[key];addXP(score*2+(pass?6:0)+(first?14:0),"lesson");if(pass){confetti();sfx("win");}}
    if(key){S.best[key]=Math.max(S.best[key]||0,score);if(pass)S.done[key]=true;save();}
    const msg=score===N?"Hoàn hảo. Lười mà giỏi ghê.":pass?"Qua bài rồi! Mai ôn lại 5 phút là nhớ lâu.":"Gần được rồi. Xem lại phần bài học một lượt rồi thử lại nha.";
    let nextBtn="";
    if(key&&pass){const tr=key[0],i=+key.slice(1);if(i+1<TRACKS[tr].data.length)nextBtn=`<button class="btn primary" id="next">Bài ${i+2} →</button>`;}
    el.innerHTML=`<div class="quiz result">
      ${tteok(pass?"cheer":"sad",104)}<span class="big">${score}/${N}</span><p class="fb ${pass?"ok":"no"}">${msg}</p>
      <div class="bar" style="justify-content:center"><button class="btn" id="again">Làm lại</button>${nextBtn||'<button class="btn primary" id="home">Về danh sách</button>'}</div></div>`;
    document.getElementById("again").onclick=()=>key?open(key[0],+key.slice(1),"q"):review();
    const nx=document.getElementById("next"),hm=document.getElementById("home");
    if(nx)nx.onclick=()=>open(key[0],+key.slice(1)+1);
    if(hm)hm.onclick=()=>{if(key)S.track=key[0];home();};
  };
  draw();
}

/* ===================== PHIÊN ÂM LATIN tự động (Revised Romanization, có luật nối âm cơ bản) ===================== */
const RR_CHO=["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
const RR_JUNG=["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
// jong index → [đọc khi đứng cuối, phụ âm đầu khi nối sang (chỉ số cho), phần còn ở lại khi nối (jong đơn hoặc -1)]
const JONG_FINAL=["","k","k","k","n","n","n","t","l","k","m","l","l","l","p","l","m","p","p","t","t","ng","t","t","k","t","p","t"];
const JONG_LINK=[null,0,1,9,2,12,2,3,5,0,6,7,9,16,17,5,6,7,9,9,10,null,12,14,15,16,17,null];
const JONG_STAY=[0,0,0,1,0,4,0,0,0,8,8,8,8,8,8,0,0,0,17,0,0,21,0,0,0,0,0,0];
function rjDecomp(ch){const c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return null;return {cho:Math.floor(c/588),jung:Math.floor(c%588/28),jong:c%28};}
function rjWord(w){
  const sy=[...w].map(ch=>{const d=rjDecomp(ch);return d?Object.assign({ch},d):{ch,raw:true};});
  for(let i=0;i<sy.length-1;i++){
    const a=sy[i],b=sy[i+1];if(a.raw||b.raw||!a.jong)continue;
    if(b.cho===11){ // nối âm vào ㅇ
      if(a.jong===27){a.jong=0;continue;} // ㅎ câm
      if(a.jong===21)continue; // ㅇ giữ nguyên
      b.cho=JONG_LINK[a.jong];a.jong=JONG_STAY[a.jong];continue;
    }
    if(b.cho===18&&[1,7,17,22,19].includes(a.jong)){ // bật hơi: k/t/p/j + ㅎ
      b.cho={1:15,7:16,17:17,22:14,19:16}[a.jong];a.jong=0;continue;}
    if(a.jong===27&&[0,3,12].includes(b.cho)){b.cho={0:15,3:16,12:14}[b.cho];a.jong=0;continue;}
    const f=JONG_FINAL[a.jong];
    if((b.cho===2||b.cho===6)){ // biến âm mũi
      if(f==="p")a.jong=16; else if(f==="k")a.jong=21; else if(f==="t")a.jong=4;
      if(a.jong===8&&b.cho===2)b.cho=5;
      continue;}
    if(a.jong===4&&b.cho===5){a.jong=8;continue;} // ㄴ+ㄹ → ㄹㄹ
    if(a.jong===8&&b.cho===2){b.cho=5;continue;}  // ㄹ+ㄴ → ㄹㄹ
    if((a.jong===16||a.jong===21)&&b.cho===5){b.cho=2;continue;} // ㅁ/ㅇ + ㄹ → ㄴ
  }
  let out="";
  sy.forEach((s,i)=>{
    if(s.raw){out+=s.ch;return;}
    let c=RR_CHO[s.cho];
    if(s.cho===5){const p=sy[i-1];c=(p&&!p.raw&&p.jong===8)?"l":"r";}
    out+=c+RR_JUNG[s.jung]+(s.jong?JONG_FINAL[s.jong]:"");
  });
  return out;
}

const HG={
  dec(ch){const c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return null;return {c:Math.floor(c/588),v:Math.floor(c%588/28),j:c%28};},
  com(c,v,j){return String.fromCharCode(0xAC00+(c*21+v)*28+(j||0));},
  JONG:["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"],
};
const hasB=w=>{const d=HG.dec(w.slice(-1));return !!(d&&d.j);};
const lastJ=w=>{const d=HG.dec(w.slice(-1));return d?d.j:0;};
function setJ(w,j){const d=HG.dec(w.slice(-1));return w.slice(0,-1)+HG.com(d.c,d.v,j);}

/* sinh đáp án sai cho 1 dạng: lỗi chia thường gặp + dạng khác cùng nhóm */
function wrongForms(d,f,n){n=n||3;const right=conj(d,f);const out=new Set();
  const st=d.slice(0,-1),lv=HG.dec(st.slice(-1));
  const okNC=!/하$/.test(st)&&lv&&!lv.j&&[0,4,6,18].includes(lv.v);
  const tries=[{noIrr:true},{flipH:true},{flipEu:true},{noIrr:true,flipEu:true}];
  if(okNC)tries.push({noContract:true},{flipH:true,noContract:true});
  for(const o of tries){try{const w=conj(d,f,o);if(w&&w!==right)out.add(w);}catch(e){}}
  let arr=shuffle([...out]);
  if(arr.length<n){const grp=FORMS[f][1];const others=shuffle(Object.keys(FORMS).filter(k=>k!==f&&FORMS[k][1]!==grp));
    for(const k of others){if(arr.length>=n)break;const w=conj(d,k);if(w!==right&&!arr.includes(w))arr.push(w);}}
  return arr.slice(0,n);
}

{g:"-아서/어서 (trình tự)",lv:1,m:"“Rồi” – hành động sau gắn với hành động trước",f:"Gốc + 아서/어서 (가다, 오다, 만나다, 앉다, 만들다…)",ex:[["친구를 [만나다:because] 영화를 봤어요.","Gặp bạn rồi cùng xem phim."],["의자에 [앉다:because] 기다리세요.","Ngồi xuống ghế rồi chờ nhé."]]},
{g:"-(으)니까",lv:1,m:"“Vì … nên” (hay đi với mệnh lệnh, rủ rê)",f:"Không patchim/ㄹ + 니까 · có patchim + 으니까",ex:[["비가 [오다:because2] 우산을 가져가세요.","Trời mưa nên mang ô đi."],["날씨가 [춥다:because2] 따뜻하게 입으세요.","Trời lạnh nên mặc ấm vào."]]},
{g:"보다 (더)",lv:1,m:"So sánh hơn: “hơn”",f:"A는 B보다 (더) + tính từ",ex:[["오빠가 [저:보다|은,의] 키가 커요.","Anh tôi cao hơn tôi."],["오늘이 [어제:보다|에,가] 더 추워요.","Hôm nay lạnh hơn hôm qua."]]},
{g:"만",lv:1,m:"“Chỉ”",f:"Danh từ + 만",ex:[["[물:만|의,에서] 주세요.","Cho tôi nước thôi."],["주말에는 [잠:만|이,에서] 자요.","Cuối tuần tôi chỉ ngủ."]]},
{g:"-네요",lv:1,m:"Cảm thán khi vừa nhận ra: “… quá nhỉ!”",f:"Gốc + 네요 · gốc ㄹ bỏ ㄹ",ex:[["이 떡볶이 정말 [맵다:neyo]!","Tteokbokki này cay thật đấy!"],["한국어를 [잘하다:neyo].","Bạn nói tiếng Hàn giỏi quá."],["집이 [멀다:neyo].","Nhà xa nhỉ."]]},
{g:"-(으)ㄹ게요",lv:1,m:"“Tôi sẽ …” (hứa, báo ý định với người nghe)",f:"Không patchim + ㄹ게요 · có patchim + 을게요 · chủ ngữ luôn là “tôi”",ex:[["제가 [전화하다:will_i].","Tôi sẽ gọi điện."],["내일 다시 [오다:will_i].","Mai tôi sẽ quay lại."],["이거 [먹다:will_i].","Tôi lấy (ăn) cái này nhé."]]},
{g:"-아/어 보세요",lv:1,m:"“Thử … đi”",f:"Gốc + 아/어 보세요",ex:[["이 김치 한번 [먹다:try].","Thử ăn miếng kim chi này đi."],["이 옷 [입다:try].","Mặc thử áo này đi."]]},
{g:"-기 전에",lv:1,m:"“Trước khi …”",f:"Gốc + 기 전에 · danh từ + 전에",ex:[["[자다:before] 이를 닦아요.","Trước khi ngủ tôi đánh răng."],["밥을 [먹다:before] 손을 씻으세요.","Rửa tay trước khi ăn."]]},
{g:"-(으)ㄴ 후에",lv:1,m:"“Sau khi …”",f:"Không patchim + ㄴ 후에 · có patchim + 은 후에 · danh từ + 후에",ex:[["수업이 [끝나다:after] 만나요.","Gặp nhau sau khi tan học nhé."],["밥을 [먹다:after] 산책해요.","Ăn xong tôi đi dạo."]]},
{g:"-아도/어도 돼요",lv:1,m:"“… cũng được / được phép …”",f:"Gốc + 아도/어도 돼요",ex:[["여기 [앉다:may]?","Tôi ngồi đây được không?"],["사진을 [찍다:may]?","Chụp ảnh được không?"]]},
{g:"-(으)면 안 돼요",lv:1,m:"“Không được …”",f:"Không patchim + 면 안 돼요 · có patchim + 으면 안 돼요",ex:[["박물관에서 음식을 [먹다:maynot].","Không được ăn trong bảo tàng."],["여기에 차를 [세우다:maynot].","Không được đỗ xe ở đây."]]},

{g:"-는 (định ngữ, động từ hiện tại)",lv:2,m:"Biến động từ thành định ngữ: “… đang / thường …”",f:"Gốc động từ + 는 + danh từ · gốc ㄹ bỏ ㄹ (사는)",ex:[["지금 [읽다:adn_pres] 책이 뭐예요?","Cuốn sách bạn đang đọc là gì?"],["서울에 [살다:adn_pres] 친구가 있어요.","Tôi có bạn sống ở Seoul."],["제가 [좋아하다:adn_pres] 가수예요.","Đó là ca sĩ tôi thích."]]},

{g:"-(으)ㄹ (định ngữ, tương lai)",lv:2,m:"Định ngữ tương lai: “… sẽ …”",f:"Không patchim + ㄹ · có patchim + 을",ex:[["내일 [하다:adn_fut] 일이 많아요.","Ngày mai có nhiều việc phải làm."],["주말에 [읽다:adn_fut] 책을 샀어요.","Tôi đã mua sách để đọc cuối tuần."]]},

{g:"-(으)면서",lv:2,m:"“Vừa … vừa …”",f:"Không patchim/ㄹ + 면서 · có patchim + 으면서 · cùng một chủ ngữ",ex:[["음악을 [듣다:while] 공부해요.","Tôi vừa nghe nhạc vừa học."],["[걷다:while] 이야기했어요.","Vừa đi bộ vừa nói chuyện."]]},

{g:"-기로 했어요",lv:2,m:"“Đã quyết định / đã hẹn …”",f:"Gốc + 기로 했어요",ex:[["친구랑 주말에 [만나다:decided].","Tôi hẹn gặp bạn cuối tuần."],["올해는 한국어를 [배우다:decided].","Năm nay tôi quyết định học tiếng Hàn."]]},

{g:"-아/어 봤어요",lv:2,m:"“Đã thử, đã từng …”",f:"Gốc + 아/어 봤어요",ex:[["한복을 [입다:tried]?","Bạn mặc thử hanbok chưa?"],["삼계탕을 [먹다:tried].","Tôi đã ăn thử gà hầm sâm rồi."]]},
{g:"-(으)ㄴ 적이 있어요",lv:2,m:"“Đã từng …” (kinh nghiệm)",f:"Không patchim + ㄴ 적이 있어요 · có patchim + 은 적이 있어요 · phủ định: 없어요",ex:[["제주도에 [가다:exp].","Tôi từng đi đảo Jeju."],["연예인을 [보다:exp]?","Bạn từng gặp người nổi tiếng chưa?"]]},
{g:"-는데요 / -(으)ㄴ데요",lv:2,m:"Nêu bối cảnh, phản hồi nhẹ nhàng, chờ người nghe phản ứng",f:"Động từ + 는데요 · tính từ + (으)ㄴ데요 · N + 인데요",ex:[["저는 지금 [바쁘다:nde]…","Tôi đang bận chút…"],["이 가방 정말 [예쁘다:nde]!","Cái túi này đẹp thật đấy!"]]},

{g:"-아/어지다",lv:2,m:"“Trở nên …” (với tính từ)",f:"Gốc tính từ + 아/어지다",ex:[["날씨가 [춥다:become].","Trời trở lạnh rồi."],["한국어가 [재미있다:become].","Tiếng Hàn ngày càng thú vị."]]},
{g:"-게 되다",lv:2,m:"“Được, trở nên, thành ra …” (do hoàn cảnh, không phải tự quyết)",f:"Gốc + 게 되다",ex:[["회사 때문에 한국에 [가다:ge_doe].","Vì công ty nên tôi được đi Hàn."],["K-드라마를 보고 한국어를 [좋아하다:ge_doe].","Xem phim Hàn rồi tôi thành ra thích tiếng Hàn."]]},

{g:"-기 시작했어요",lv:2,m:"“Bắt đầu …”",f:"Gốc + 기 시작하다",ex:[["비가 [오다:gistart].","Trời bắt đầu mưa."],["작년부터 한국어를 [배우다:gistart].","Tôi bắt đầu học tiếng Hàn từ năm ngoái."]]},
{g:"-는 중이에요",lv:2,m:"“Đang trong lúc …”",f:"Gốc động từ + 는 중이에요 · danh từ + 중",ex:[["지금 [가다:jung].","Tôi đang trên đường đi."],["숙제를 [하다:jung].","Tôi đang làm bài tập."]]},
{g:"-아/어 있어요",lv:2,m:"Trạng thái còn lại sau hành động: “đang (ngồi, mở…)”",f:"Gốc (nội động từ/bị động) + 아/어 있다",n:"Khác -고 있다 (đang làm): 앉고 있어요 = đang ngồi xuống; 앉아 있어요 = đang ngồi.",ex:[["친구가 의자에 [앉다:state].","Bạn tôi đang ngồi trên ghế."],["동생은 침대에 [눕다:state].","Em tôi đang nằm trên giường."]]},
{g:"-(으)ㄹ 줄 알아요/몰라요",lv:2,m:"“Biết / không biết (cách) …”",f:"Không patchim + ㄹ 줄 알다 · có patchim + 을 줄 알다",ex:[["김치를 [만들다:knowhow]?","Bạn biết làm kim chi không?"],["저는 운전을 [하다:knowhow].","Tôi biết lái xe."]]},
{g:"-아/어야겠어요",lv:2,m:"“Chắc phải … thôi” (quyết tâm, tự nhủ)",f:"Gốc + 아/어야겠다",ex:[["피곤해서 일찍 [자다:yagetda].","Mệt quá, chắc phải ngủ sớm thôi."],["다이어트를 [하다:yagetda].","Chắc phải ăn kiêng thôi."]]},

{g:"-았/었으면 좋겠어요",lv:2,m:"“Ước gì, mong là …”",f:"Gốc + 았/었으면 좋겠다",ex:[["주말에 날씨가 [좋다:wish].","Mong cuối tuần trời đẹp."],["시험에 [합격하다:wish].","Ước gì thi đỗ."]]},
{g:"-아/어 버렸어요",lv:2,m:"“… mất rồi” (xong hẳn, thường tiếc nuối)",f:"Gốc + 아/어 버리다",ex:[["케이크를 다 [먹다:beorida].","Tôi ăn hết bánh kem mất rồi."],["약속을 [잊다:beorida].","Tôi quên mất cuộc hẹn rồi."]]},
{g:"-게 (trạng từ)",lv:2,m:"“Một cách …” – biến tính từ thành trạng từ",f:"Gốc tính từ + 게",ex:[["[맛있다:ge] 드세요.","Chúc ăn ngon miệng."],["[예쁘다:ge] 찍어 주세요.","Chụp đẹp giúp tôi nhé."],["[조용하다:ge] 말해 주세요.","Nói khẽ giúp tôi."]]},
{g:"-다가",lv:2,m:"“Đang … thì (chuyển sang/bị gián đoạn)”",f:"Gốc + 다가",ex:[["집에 [가다:daga] 친구를 만났어요.","Đang về nhà thì gặp bạn."],["드라마를 [보다:daga] 잠들었어요.","Đang xem phim thì ngủ quên."]]},
{g:"-자마자",lv:2,m:"“Ngay khi …”",f:"Gốc + 자마자",ex:[["집에 [오다:jamaja] 잤어요.","Vừa về đến nhà là ngủ luôn."],["수업이 [끝나다:jamaja] 나갔어요.","Tan học là đi ngay."]]},
{g:"-나요? / -(으)ㄴ가요?",lv:2,m:"Câu hỏi mềm mỏng, nhẹ nhàng",f:"Động từ + 나요? · tính từ + (으)ㄴ가요?",ex:[["이 버스 명동에 [가다:nayo]","Xe buýt này có đi Myeongdong không ạ?"],["이 옷은 [비싸다:nayo]","Áo này có đắt không ạ?"]]},
{g:"-(으)ㄹ래요",lv:2,m:"“Muốn …?” (hỏi ý thân mật) / “tôi muốn …”",f:"Không patchim + ㄹ래요 · có patchim + 을래요",ex:[["뭐 [마시다:llae]?","Bạn muốn uống gì?"],["저는 비빔밥 [먹다:llae].","Mình muốn ăn bibimbap."]]},

{g:"-(으)ㄴ 지 ~ 됐어요",lv:2,m:"“Đã được (bao lâu) kể từ khi …”",f:"Gốc + (으)ㄴ 지 + thời gian + 되다",ex:[["한국어를 [배우다:ji] 1년 됐어요.","Tôi học tiếng Hàn được 1 năm rồi."],["한국에 [오다:ji] 3개월 됐어요.","Tôi đến Hàn được 3 tháng."]]},
{g:"-아도/어도",lv:2,m:"“Dù … cũng”",f:"Gốc + 아도/어도",ex:[["[비싸다:even] 사고 싶어요.","Dù đắt tôi vẫn muốn mua."],["[바쁘다:even] 아침은 꼭 먹어요.","Dù bận tôi vẫn luôn ăn sáng."]]},
{g:"이나",lv:2,m:"“Hoặc” · “hay là … gì đó” · “những (nhiều hơn mong đợi)”",f:"Patchim + 이나 · không patchim + 나",ex:[["[커피:이나|을,의] 차 마실래요?","Uống cà phê hay trà không?"],["[주말:이나|을,가] 만날까요?","Cuối tuần gặp nhau nhé?"]]},
{g:"쯤 · 마다 · 처럼",lv:2,m:"쯤 “khoảng” · 마다 “mỗi” · 처럼 “giống như”",f:"Danh từ + 쯤/마다/처럼",ex:[["[세 시:쯤|을,이] 도착해요.","Khoảng 3 giờ tôi tới."],["[아침:마다|을,이] 운동해요.","Sáng nào tôi cũng tập thể dục."],["[가수:처럼|을,에서] 노래를 잘해요.","Hát hay như ca sĩ."]]},
{g:"밖에 + phủ định",lv:2,m:"“Chỉ … thôi” (ít hơn mong đợi)",f:"Danh từ + 밖에 + 없다/안/못",ex:[["[천 원:밖에|을,에서] 없어요.","Tôi chỉ có 1.000 won thôi."],["[한 시간:밖에|이,의] 못 잤어요.","Tôi chỉ ngủ được một tiếng."]]},
// ---------- TRUNG CẤP 1
{g:"-더라고요",lv:3,m:"Kể lại điều mình đã tự thấy/trải nghiệm: “thấy … lắm”",f:"Gốc + 더라고요",ex:[["그 식당 진짜 [맛있다:deorago].","Quán đó (tôi thấy) ngon thật đấy."],["한국 사람들은 정말 빨리 [걷다:deorago].","Người Hàn đi bộ nhanh thật đấy."]]},
{g:"-잖아요",lv:3,m:"“… mà!” – nhắc điều người nghe cũng biết",f:"Gốc + 잖아요",ex:[["내일 시험이 [있다:janayo]. 공부해야지.","Mai có kiểm tra mà. Phải học chứ."],["제가 매운 거 못 [먹다:janayo].","Tôi không ăn cay được mà."]]},
{g:"-(으)ㄹ 뻔했어요",lv:3,m:"“Suýt nữa thì …”",f:"Không patchim + ㄹ 뻔했다 · có patchim + 을 뻔했다",ex:[["늦게 일어나서 비행기를 [놓치다:ppeon].","Dậy muộn nên suýt lỡ chuyến bay."],["길에서 [넘어지다:ppeon].","Suýt ngã trên đường."]]},
{g:"-느라고",lv:3,m:"“Vì mải … nên” (kết quả không tốt)",f:"Gốc động từ + 느라고 · gốc ㄹ bỏ ㄹ",ex:[["게임을 [하다:neurago] 숙제를 못 했어요.","Mải chơi game nên không làm bài tập."],["드라마를 [보다:neurago] 잠을 못 잤어요.","Mải xem phim nên mất ngủ."]]},
{g:"-는 바람에",lv:3,m:"“Vì (bất ngờ) … nên” (kết quả xấu)",f:"Gốc động từ + 는 바람에",ex:[["버스를 [놓치다:baram] 늦었어요.","Vì lỡ xe buýt nên tôi bị muộn."],["갑자기 비가 [오다:baram] 옷이 다 젖었어요.","Mưa bất chợt nên ướt hết quần áo."]]},
{g:"-(으)ㄹ수록",lv:3,m:"“Càng … càng …”",f:"-(으)면 -(으)ㄹ수록",ex:[["한국어는 [배우다:sulok] 재미있어요.","Tiếng Hàn càng học càng thú vị."],["이 노래는 [듣다:sulok] 좋아요.","Bài này càng nghe càng hay."]]},
{g:"-도록",lv:3,m:"“Để, sao cho …”",f:"Gốc + 도록",ex:[["늦지 [않다:dorok] 일찍 출발하세요.","Hãy xuất phát sớm để không bị muộn."],["감기에 걸리지 [않다:dorok] 조심하세요.","Cẩn thận đừng để bị cảm."]]},
{g:"-ㄴ/는대요 (lời gián tiếp)",lv:3,m:"“Nghe nói / (ai đó) bảo là …”",f:"Động từ + ㄴ/는대요 · tính từ + 대요 · N(이)래요",ex:[["내일 비가 [오다:daeyo].","Nghe nói mai trời mưa."],["민지 씨가 한국 음식을 [좋아하다:daeyo].","Min-ji bảo là thích đồ ăn Hàn."],["그 영화가 [재미있다:daeyo].","Nghe nói phim đó hay."]]},
{g:"-냐고 했어요",lv:3,m:"Gián tiếp câu hỏi: “hỏi rằng …”",f:"Gốc + 냐고 하다 (gốc ㄹ bỏ ㄹ)",ex:[["친구가 어디에 [가다:nyago].","Bạn tôi hỏi là đi đâu."],["선생님이 숙제를 [하다:nyago].","Cô giáo hỏi là có làm bài tập không."]]},
{g:"-자고 했어요",lv:3,m:"Gián tiếp lời rủ: “rủ rằng …”",f:"Gốc + 자고 하다",ex:[["친구가 같이 [놀다:jago].","Bạn rủ đi chơi cùng."],["동생이 치킨을 [먹다:jago].","Em tôi rủ ăn gà rán."]]},
{g:"-(으)라고 했어요",lv:3,m:"Gián tiếp mệnh lệnh: “bảo (hãy) …”",f:"Không patchim/ㄹ + 라고 · có patchim + 으라고",ex:[["엄마가 일찍 [자다:rago].","Mẹ bảo đi ngủ sớm."],["의사가 약을 [먹다:rago].","Bác sĩ bảo uống thuốc."]]},
{g:"-나 봐요 / -(으)ㄴ가 봐요",lv:3,m:"“Có vẻ như …” (đoán từ điều nhìn thấy)",f:"Động từ + 나 봐요 · tính từ + (으)ㄴ가 봐요",ex:[["밖에 비가 [오다:nabwa]. 우산을 쓰고 있어요.","Hình như ngoài trời mưa. Người ta đang che ô."],["민수 씨가 [피곤하다:nabwa].","Min-su có vẻ mệt."]]},
{g:"-(으)ㄹ지도 몰라요",lv:3,m:"“Không chừng, biết đâu …”",f:"Không patchim + ㄹ지도 모르다 · có patchim + 을지도 모르다",ex:[["오후에 비가 [오다:jidomolla].","Không chừng chiều nay mưa."],["그 가수가 공항에 [있다:jidomolla].","Biết đâu ca sĩ đó đang ở sân bay."]]},
{g:"-군요 / -는군요",lv:3,m:"“À, ra là …” (nhận ra điều mới)",f:"Động từ + 는군요 · tính từ + 군요",ex:[["한국어를 정말 [잘하다:gunyo].","À, bạn nói tiếng Hàn giỏi thật."],["서울은 겨울이 정말 [춥다:gunyo].","Ra là mùa đông Seoul lạnh thật."]]},
{g:"-는데도 / -(으)ㄴ데도",lv:3,m:"“Mặc dù … (mà vẫn)”",f:"Động từ + 는데도 · tính từ + (으)ㄴ데도",ex:[["열심히 [공부하다:deundo] 성적이 안 올라요.","Học chăm mà điểm vẫn không lên."],["[춥다:deundo] 아이스 아메리카노를 마셔요.","Lạnh mà vẫn uống americano đá."]]},
{g:"-(으)ㄹ 테니까",lv:3,m:"“Vì (tôi) sẽ … nên (bạn hãy)”",f:"Không patchim + ㄹ 테니까 · có patchim + 을 테니까",ex:[["제가 [요리하다:teni] 설거지 좀 해 주세요.","Tôi sẽ nấu nên bạn rửa bát giúp nhé."],["밖이 [춥다:teni] 따뜻하게 입어요.","Ngoài trời chắc lạnh nên mặc ấm vào."]]},
{g:"-던",lv:3,m:"Định ngữ hồi tưởng: “… từng / đang dở”",f:"Gốc + 던",ex:[["제가 [먹다:deon] 빵 어디 있어요?","Cái bánh tôi đang ăn dở đâu rồi?"],["어릴 때 [살다:deon] 동네에 가 봤어요.","Tôi về thăm khu phố hồi nhỏ từng sống."]]},
{g:"-는 게 좋겠어요",lv:3,m:"“Nên … thì hơn”",f:"Gốc động từ + 는 게 좋겠다",ex:[["오늘은 집에서 [쉬다:neunge].","Hôm nay nên nghỉ ở nhà thì hơn."],["지하철을 [타다:neunge].","Nên đi tàu điện ngầm thì hơn."]]},
{g:"-(으)ㄹ 만해요",lv:3,m:"“Đáng để …”",f:"Không patchim + ㄹ 만하다 · có patchim + 을 만하다",ex:[["이 드라마 정말 [보다:manhae].","Phim này rất đáng xem."],["그 식당 음식은 [먹다:manhae].","Đồ ăn quán đó ăn cũng được (đáng thử)."]]},
{g:"-기 위해서",lv:3,m:"“Để (mục đích) …”",f:"Gốc + 기 위해(서) · danh từ + 을/를 위해(서)",ex:[["한국 회사에 [취직하다:wihae] 한국어를 배워요.","Tôi học tiếng Hàn để xin vào công ty Hàn."],["건강을 [지키다:wihae] 매일 걸어요.","Tôi đi bộ mỗi ngày để giữ sức khỏe."]]},
{g:"-아/어서 그런지",lv:3,m:"“Có lẽ vì … nên”",f:"Gốc + 아/어서 그런지",ex:[["어제 늦게 [자다:geureonji] 너무 피곤해요.","Có lẽ vì hôm qua ngủ muộn nên mệt quá."],["주말이라서 그런지 사람이 많아요.","Có lẽ vì cuối tuần nên đông người."]]},
{g:"-고 나서",lv:3,m:"“Sau khi … xong”",f:"Gốc + 고 나서",ex:[["밥을 [먹다:gonaseo] 커피를 마셔요.","Ăn cơm xong rồi uống cà phê."],["숙제를 [하다:gonaseo] 게임을 해요.","Làm xong bài tập rồi chơi game."]]},
{g:"-ㄴ/는다면",lv:3,m:"“Giả sử … thì”",f:"Động từ + ㄴ/는다면 · tính từ + 다면",ex:[["복권에 [당첨되다:damyeon] 세계 여행을 할 거예요.","Giả sử trúng xổ số tôi sẽ đi du lịch vòng quanh thế giới."],["시간이 [있다:damyeon] 같이 가요.","Nếu có thời gian thì đi cùng nhé."]]},
{g:"-(으)ㄹ 정도로",lv:3,m:"“Đến mức …”",f:"Không patchim + ㄹ 정도로 · có patchim + 을 정도로",ex:[["눈물이 [나다:jeongdo] 웃었어요.","Cười đến chảy nước mắt."],["[죽다:jeongdo] 피곤해요.","Mệt muốn chết."]]},
{g:"-는 대로",lv:3,m:"“Ngay khi … / theo như …”",f:"Gốc động từ + 는 대로",ex:[["[도착하다:daero] 연락할게요.","Tới nơi là tôi liên lạc ngay."],["제가 [말하다:daero] 해 보세요.","Làm theo như tôi nói thử xem."]]},
{g:"-(으)ㄹ걸요",lv:3,m:"“Chắc là … đấy” (đoán, không chắc chắn)",f:"Không patchim + ㄹ걸요 · có patchim + 을걸요",ex:[["지금 출발하면 [늦다:geolyo].","Giờ mới đi chắc là muộn đấy."],["그 가게는 일요일에 [쉬다:geolyo].","Cửa hàng đó chắc nghỉ Chủ nhật đấy."]]},
{g:"-(으)ㄹ걸 그랬어요",lv:3,m:"“Biết thế đã … (tiếc)”",f:"Không patchim + ㄹ걸 그랬다 · có patchim + 을걸 그랬다",ex:[["우산을 [가져오다:geolgeurae].","Biết thế đã mang ô."],["어제 일찍 [자다:geolgeurae].","Biết thế hôm qua ngủ sớm."]]},
{g:"-았/었던",lv:3,m:"Định ngữ hồi tưởng việc đã xong: “… đã từng”",f:"Gốc + 았/었던",ex:[["작년에 [가다:eotdeon] 카페에 또 가고 싶어요.","Tôi muốn lại đến quán cà phê năm ngoái từng đi."],["어렸을 때 [좋아하다:eotdeon] 가수예요.","Đó là ca sĩ tôi từng thích hồi nhỏ."]]},
// ---------- TRUNG CẤP 2
{g:"-는/(으)ㄴ 반면에",lv:4,m:"“Trái lại, ngược lại …”",f:"Động từ + 는 반면에 · tính từ + (으)ㄴ 반면에",ex:[["서울은 [복잡하다:banmyeon] 시골은 조용해요.","Seoul đông đúc, ngược lại nông thôn yên tĩnh."],["이 일은 월급이 [많다:banmyeon] 너무 바빠요.","Việc này lương cao nhưng ngược lại rất bận."]]},
{g:"-(으)ㄹ 뿐만 아니라",lv:4,m:"“Không những … mà còn …”",f:"Không patchim + ㄹ 뿐만 아니라 · có patchim + 을 뿐만 아니라",ex:[["이 식당은 [싸다:ppunmanira] 맛있어요.","Quán này không những rẻ mà còn ngon."],["그 가수는 노래를 [잘하다:ppunmanira] 춤도 잘 춰요.","Ca sĩ đó không những hát hay mà còn nhảy giỏi."]]},
{g:"-는 한",lv:4,m:"“Chừng nào còn …”",f:"Gốc động từ + 는 한",ex:[["포기하지 [않다:neunhan] 꿈은 이루어져요.","Chừng nào còn không bỏ cuộc thì ước mơ sẽ thành."],["제가 [알다:neunhan] 그 사람은 착해요.","Theo như tôi biết thì người đó hiền."]]},
{g:"-(으)ㄴ 탓에",lv:4,m:"“Tại vì …” (đổ lỗi, kết quả xấu)",f:"Gốc + (으)ㄴ 탓에 · danh từ + 탓에",ex:[["늦게 [일어나다:tat] 수업에 늦었어요.","Tại dậy muộn nên trễ học."],["너무 많이 [먹다:tat] 배가 아파요.","Tại ăn nhiều quá nên đau bụng."]]},
{g:"-(으)ㄴ 덕분에",lv:4,m:"“Nhờ có …”",f:"Gốc + (으)ㄴ 덕분에 · danh từ + 덕분에",ex:[["친구가 [도와주다:deokbun] 일을 빨리 끝냈어요.","Nhờ bạn giúp mà xong việc sớm."],["열심히 [공부하다:deokbun] 시험에 합격했어요.","Nhờ học chăm nên thi đỗ."]]},
{g:"-(으)ㄹ 리가 없어요",lv:4,m:"“Không lý nào …”",f:"Không patchim + ㄹ 리가 없다 · có patchim + 을 리가 없다",ex:[["그 사람이 거짓말을 [하다:riga].","Không lý nào người đó nói dối."],["벌써 [끝나다:riga].","Không lý nào đã xong rồi."]]},
{g:"-기 마련이에요",lv:4,m:"“Đương nhiên là, ắt sẽ …” (quy luật)",f:"Gốc + 기 마련이다",ex:[["처음에는 누구나 [실수하다:maryeon].","Ban đầu ai cũng mắc lỗi là chuyện thường."],["시간이 지나면 [잊다:maryeon].","Thời gian trôi qua thì ắt sẽ quên."]]},
{g:"-(으)ㄴ 셈이에요",lv:4,m:"“Coi như là …”",f:"Gốc + (으)ㄴ 셈이다",ex:[["일이 거의 다 [끝나다:sem].","Việc coi như xong cả rồi."],["숙제를 반쯤 [하다:sem].","Bài tập coi như đã làm được một nửa."]]},
{g:"-다 보니까",lv:4,m:"“Cứ … thì (thành ra / nhận ra)”",f:"Gốc + 다 보니(까)",ex:[["매일 [연습하다:dabonikka] 실력이 늘었어요.","Cứ luyện mỗi ngày thì trình độ tăng lên."],["K-드라마를 [보다:dabonikka] 한국어를 알아듣게 됐어요.","Cứ xem phim Hàn thì thành ra nghe hiểu tiếng Hàn."]]},
{g:"-았/었더니",lv:4,m:"“(Tôi) đã … thì (kết quả là)”",f:"Gốc + 았/었더니 (chủ ngữ thường là tôi)",ex:[["아침에 [운동하다:eotdeoni] 기분이 좋아요.","Sáng tôi tập thể dục nên giờ thấy vui."],["친구한테 [전화하다:eotdeoni] 안 받았어요.","Tôi gọi cho bạn thì bạn không nghe."]]},
{g:"-(으)ㄹ 겸",lv:4,m:"“Kiêm, tiện thể …”",f:"-(으)ㄹ 겸 -(으)ㄹ 겸 · N 겸 N",ex:[["[쉬다:gyeom] 여행 갔어요.","Đi du lịch tiện thể nghỉ ngơi."],["운동도 [하다:gyeom] 걸어서 왔어요.","Tôi đi bộ đến, tiện thể tập thể dục."]]},
{g:"-아/어 봤자",lv:4,m:"“Có … cũng vô ích”",f:"Gốc + 아/어 봤자",ex:[["지금 [가다:bwatja] 늦었어요.","Giờ có đi cũng muộn rồi."],["[후회하다:bwatja] 소용없어요.","Có hối hận cũng chẳng ích gì."]]},

/* render ví dụ có đánh dấu → {text, target, opts} */
const MARK_RE=/\[([^\]:]+):([^\]|]*)(?:\|([^\]]*))?\]/;
function copulaWrong(n,p){const B=hasB(n);
  if(p==="이에요")return [n+(B?"예요":"이에요"),n+(B?"이예요":"이예요"),n+"에요"].filter(x=>x!==particle(n,p));
  if(p==="아니에요")return [n+(B?"가":"이")+" 아니에요",particle(n,"을")+" 아니에요",particle(n,"이")+" 아니예요"];
  if(p==="이었어요")return [n+(B?"였어요":"이었어요"),n+"이였어요",n+"었어요"].filter(x=>x!==particle(n,p));
  return [];}
function gRender(ex){
  const m=ex.match(MARK_RE);if(!m)return {text:ex,target:null};
  const [all,a,b,dl]=m;let target,wrong=[];
  if(FORMS[b]){target=conj(a,b);wrong=wrongForms(a,b,3);}
  else{target=particle(a,b);
    if(["이에요","아니에요","이었어요"].includes(b))wrong=copulaWrong(a,b);
    else{const pw=particleWrong(a,b);if(pw&&pw!==target)wrong.push(pw);(dl||"").split(",").filter(Boolean).forEach(k=>{const w=particle(a,k.trim());if(w!==target&&!wrong.includes(w))wrong.push(w);});}
    wrong=wrong.slice(0,3);}
  const text=ex.replace(all,target);
  return {text,target,blanked:ex.replace(all,"___"),wrong};
}

/* ---------- bàn phím Hangul (두벌식) ---------- */
const CJ="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ",VJ="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONGL=HG.JONG;
const VCOMB={"ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ"};
const JCOMB={"ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ"};
const JSPLIT={};Object.entries(JCOMB).forEach(([k,v])=>JSPLIT[v]=[k[0],k[1]]);
const VSPLIT={};Object.entries(VCOMB).forEach(([k,v])=>VSPLIT[v]=k[0]);
function hjType(val,k){const last=val.slice(-1),pre=val.slice(0,-1),d=HG.dec(last||" ");
  if(CJ.includes(k)){
    if(d&&!d.j&&JONGL.indexOf(k)>0)return pre+HG.com(d.c,d.v,JONGL.indexOf(k));
    if(d&&d.j){const cmb=JCOMB[JONGL[d.j]+k];if(cmb)return pre+HG.com(d.c,d.v,JONGL.indexOf(cmb));}
    return val+k;}
  if(VJ.includes(k)){
    if(last&&CJ.includes(last))return pre+HG.com(CJ.indexOf(last),VJ.indexOf(k),0);
    if(d&&!d.j){const cv=VCOMB[VJ[d.v]+k];if(cv)return pre+HG.com(d.c,VJ.indexOf(cv),0);}
    if(d&&d.j){const J=JONGL[d.j];let keep=0,move=J;if(JSPLIT[J]){keep=JONGL.indexOf(JSPLIT[J][0]);move=JSPLIT[J][1];}
      if(CJ.includes(move))return pre+HG.com(d.c,d.v,keep)+HG.com(CJ.indexOf(move),VJ.indexOf(k),0);}
    return val+k;}
  return val+k;}
function hjBack(val){const last=val.slice(-1),pre=val.slice(0,-1),d=HG.dec(last||" ");
  if(d){if(d.j){const J=JONGL[d.j];return pre+HG.com(d.c,d.v,JSPLIT[J]?JONGL.indexOf(JSPLIT[J][0]):0);}
    const V=VJ[d.v];if(VSPLIT[V])return pre+HG.com(d.c,VJ.indexOf(VSPLIT[V]),0);return pre+CJ[d.c];}
  return pre;}
const KROWS=[["ㅂ","ㅈ","ㄷ","ㄱ","ㅅ","ㅛ","ㅕ","ㅑ","ㅐ","ㅔ"],["ㅁ","ㄴ","ㅇ","ㄹ","ㅎ","ㅗ","ㅓ","ㅏ","ㅣ"],["⇧","ㅋ","ㅌ","ㅊ","ㅍ","ㅠ","ㅜ","ㅡ","⌫"]];
const KSHIFT={"ㅂ":"ㅃ","ㅈ":"ㅉ","ㄷ":"ㄸ","ㄱ":"ㄲ","ㅅ":"ㅆ","ㅐ":"ㅒ","ㅔ":"ㅖ"};
function kbd(input,onEnter){let shift=false;const box=document.createElement("div");box.className="hkbd";
  const draw=()=>{box.innerHTML=KROWS.map(r=>`<div class="kr">${r.map(k=>{const t=shift&&KSHIFT[k]?KSHIFT[k]:k;return `<button type="button" class="kk${k==="⇧"?" fn"+(shift?" on":""):k==="⌫"?" fn":""}${VJ.includes(t)?" vw":""}" data-k="${k}">${t}</button>`;}).join("")}</div>`).join("")+
    `<div class="kr"><button type="button" class="kk fn sp" data-k=" ">dấu cách</button><button type="button" class="kk fn ok" data-k="⏎">OK</button></div>`;};

function typeBox(id,ph){return `<div class="tbox"><input class="tin fr" id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ko" placeholder="${ph||"Gõ tiếng Hàn…"}"><button type="button" class="btn sm" data-kbd="${id}" aria-pressed="false">⌨️ 한</button></div><div id="${id}-k"></div>`;}

const normKo=s=>String(s).replace(/[\s.,!?~…"'“”‘’()·]/g,"");
/* so khớp âm tiết (để chấm nói / nghe chép) */
function sylDiff(target,got){const a=[...normKo(target)],b=[...normKo(got)];const n=a.length,m=b.length;const D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=a[i-1]===b[j-1]?D[i-1][j-1]+1:Math.max(D[i-1][j],D[i][j-1]);
  const ok=new Array(n).fill(false);let i=n,j=m;while(i>0&&j>0){if(a[i-1]===b[j-1]){ok[i-1]=true;i--;j--;}else if(D[i-1][j]>=D[i][j-1])i--;else j--;}
  const score=n?Math.round(D[n][m]/Math.max(n,m)*100):0;
  let k=0;const html=[...String(target)].map(ch=>{if(/[\s.,!?~…"'“”‘’()·]/.test(ch))return esc(ch);const c=ok[k++];return `<span class="${c?"sy-ok":"sy-no"}">${esc(ch)}</span>`;}).join("");
  return {score,html};}

        <button class="hs lvchip" data-go="me"><span class="lvdot">${L.lv}</span><span><b class="fr">${L.ko}</b><small>Cấp ${L.lv} · ${S.xp} XP</small></span></button>

     <input class="onb-in" id="onick" maxlength="16" placeholder="Biệt danh (không bắt buộc)" value="${esc(S.nick||"")}"><p class="note">Chỉ là biệt danh cho vui, không cần tên thật.</p>`,
   ()=>`<div class="onb-mas">${tteok("think",130)}</div><h2>Bạn học tiếng Hàn để làm gì?</h2><div class="opick">${[["kpop","🎤","Hiểu K-pop & phim Hàn"],["travel","✈️","Đi du lịch Hàn"],["study","🎓","Du học, thi TOPIK"],["work","💼","Đi làm, công ty Hàn"],["fun","🌸","Học cho vui"]].map(([k,ic,t])=>`<button class="opk${S.why===k?" on":""}" data-why="${k}"><span>${ic}</span>${t}</button>`).join("")}</div>`,
   ()=>`<div class="onb-mas">${tteok("wow",130)}</div><h2>Mỗi ngày học bao lâu?</h2><div class="opick">${[[20,"☕","5 phút","Nhẹ nhàng"],[40,"🍵","10 phút","Vừa phải"],[60,"🔥","15 phút","Chăm chỉ"],[80,"🚀","20 phút","Siêu tốc"]].map(([v,ic,t,s])=>`<button class="opk${S.goal===v?" on":""}" data-goal="${v}"><span>${ic}</span>${t}<small>${s} · ${v} XP</small></button>`).join("")}</div>`,
   ()=>`<div class="onb-mas">${tteok("normal",130)}</div><h2>Bạn biết tiếng Hàn tới đâu rồi?</h2><div class="opick">${[["n","🌱","Chưa biết gì","Bắt đầu từ bảng chữ Hangul"],["s","📖","Đọc được Hangul","Học phát âm chuẩn rồi lên ngữ pháp"],["g","🧩","Biết chút ít","Vào thẳng Level 2 (TOPIK 1)"],["h","🚀","Học xong sơ cấp","Vào Level 3 (TOPIK 2)"]].map(([k,ic,t,s])=>`<button class="opk${S.track===k?" on":""}" data-lvl="${k}"><span>${ic}</span>${t}<small>${s}</small></button>`).join("")}</div>`
  ];
  app.innerHTML=`<div class="onb card"><div class="onb-dots">${steps.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>${steps[step]()}
    <div class="bar center"><button class="btn" id="oskip">${step?"← Quay lại":"Bỏ qua"}</button><button class="btn primary" id="onext">${step<steps.length-1?"Tiếp →":"Bắt đầu học! 🎉"}</button></div></div>`;
  const pick=(attr,set)=>app.querySelectorAll(`[data-${attr}]`).forEach(b=>b.onclick=()=>{set(b.dataset[attr]);sfx("tap");app.querySelectorAll(`[data-${attr}]`).forEach(x=>x.classList.toggle("on",x===b));});
  pick("why",v=>S.why=v);pick("goal",v=>S.goal=+v);pick("lvl",v=>S.track=v);
  const saveNick=()=>{const i=document.getElementById("onick");if(i)S.nick=i.value.trim().slice(0,16);};
  document.getElementById("oskip").onclick=()=>{saveNick();if(step)onboarding(step-1);else{S.onb=1;save();home();}};
  document.getElementById("onext").onclick=()=>{saveNick();if(step<steps.length-1)onboarding(step+1);else{S.onb=1;save();confetti();sfx("win");home();tPop(`<b>Bắt đầu thôi${S.nick?", "+esc(S.nick):""}!</b><br>Học xong bài nào, mình tặng XP bài đó nha.`,"cheer");}};
}

/* ---------- THẺ KHOE THÀNH TÍCH ---------- */
async function shareCard(){
  const L=lvInfo(S.xp);const W=1080,H=1350;const cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
  try{await document.fonts.ready;}catch(e){}
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,"#DCEEFC");g.addColorStop(.55,"#EEF6FD");g.addColorStop(1,"#FDE3E6");c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle="rgba(62,140,203,.12)";for(let y=30;y<H;y+=44)for(let x=(y/44)%2?22:0;x<W;x+=44){c.beginPath();c.arc(x,y,4,0,7);c.fill();}
  const img=new Image();img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(tteok("cheer",520,S.outfit).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '));
  await new Promise(r=>{img.onload=r;img.onerror=r;});
  try{c.drawImage(img,W/2-260,170,520,520);}catch(e){}

function mugungGame(area,end){

      refresh();ask();},{delay:0,locked:()=>phase==="look",onLocked:caught});};

    timers.push(setTimeout(look,total+120));};
  const look=()=>{if(!alive("mugung"))return;phase="look";const f=area.querySelector(".mgfield");f.className="mgfield look";area.querySelector(".mg-tag").innerHTML=tteok("wow",70,"gat");area.querySelector("#mmsg").innerHTML="<b>Bé Tteok quay lại! Đứng im, đừng bấm!</b>";
    timers.push(setTimeout(()=>{if(phase==="look")chant();},[0,1100,1500,1700][GL]+Math.random()*[0,700,1200,1400][GL]));};

function kkeutGame(area,end){let dead=false;const ok_=()=>!dead&&alive("kkeut");
  const words=[...new Set(VT.filter(t=>t.noun).flatMap(t=>t.items.map(x=>x.k)).filter(k=>/^[가-힣]{2,5}$/.test(k)))];
  const byFirst={};words.forEach(w=>{(byFirst[w[0]]=byFirst[w[0]]||[]).push(w);});
  const dueum=ch=>{const d=HG.dec(ch);const out=[ch];if(!d)return out;
    if(d.c===5){out.push(HG.com([2,3,6,7,12,20].includes(d.v)?11:2,d.v,d.j));}
    else if(d.c===2&&[6,12,17,20].includes(d.v))out.push(HG.com(11,d.v,d.j));return out;};
  const used=new Set();let chain=0,timer=null,miss=[0,2,1,0][GL];const hist=[];

    setTimeout(()=>ok_()&&end(chain,{win:false,msg}),2000);};

  const mean=w=>(WMAP[w]||{}).v||"";
  const draw=(msg)=>{area.innerHTML=`<div class="ytop"><div class="ypl me"><b>Chuỗi nối</b><span class="sc">${chain}</span></div><div class="ypl tt"><b>Thời gian</b><div class="tbar sm"><i id="kt"></i></div></div></div>
    <div class="kchain">${hist.slice(-6).map(([w,who])=>`<div class="kb ${who}"><b class="fr">${esc(w)}</b><small>${esc(mean(w))}</small></div>`).join("")}</div>
    <p class="ymsg" id="kmsg">${msg||""}</p><div id="kq"></div>`;};
  const ttPlay=(last)=>{let c=last?cands(last):words.filter(w=>!used.has(w)&&cands(w.slice(-1)).length>1);if(!last&&!c.length)c=words.filter(w=>cands(w.slice(-1)).length>0);
    if(!c.length){draw("Bé Tteok bí từ rồi! 졌다~ Bạn thắng ván này!");sfx("win");return setTimeout(()=>ok_()&&end(chain,{win:true,msg:`Bé Tteok chịu thua! Chuỗi ${chain} từ.`}),1400);}
    const good=c.filter(w=>{used.add(w);const n=cands(w.slice(-1)).length;used.delete(w);return n>0;});
    const killer=c.filter(w=>!good.includes(w));
    let w;if(GL>1&&chain>=(GL===2?10:7)&&killer.length&&Math.random()<.35)w=rnd(killer);else w=rnd(good.length?good:c);
    used.add(w);hist.push([w,"tt"]);speak(w,.85);
    const nxt=cands(w.slice(-1));
    if(!nxt.length){draw(`Bé Tteok dùng <b>한방 단어</b> “${esc(w)}” — không còn từ nào nối được! 😈`);sfx("no");return setTimeout(()=>ok_()&&end(chain,{win:false,msg:`Bé Tteok tung chiêu 한방 단어! Bạn nối được ${chain} từ.`}),2000);}
    myTurn(w);};
  const myTurn=(w)=>{if(!ok_())return;const last=w.slice(-1),acc=dueum(last);
    draw(`Từ của bé Tteok kết thúc bằng <b class="fr">${last}</b>${acc.length>1?` (theo 두음법칙 cũng nối được bằng <b class="fr">${acc[1]}</b>)`:""}. Chọn từ bắt đầu bằng chữ đó!`);
    const right=rnd(cands(last));const wrong=shuffle(words.filter(x=>!acc.includes(x[0])&&!used.has(x))).slice(0,GL===1?2:3);
    const opts=shuffle([right,...wrong]);const q=document.getElementById("kq");
    q.innerHTML=`<div class="mq-o">${opts.map(o=>`<button class="opt fr" data-w="${esc(o)}">${esc(o)}${RJon()||GL===1?`<small class="rjx">${esc(rj(o))}</small>`:""}${GL===1?`<small class="rjx">${esc(mean(o))}</small>`:""}</button>`).join("")}</div>`;
    const T=GL===1?20000:GL===2?Math.max(8000,14000-chain*300):Math.max(6000,11000-chain*300);const kt=document.getElementById("kt");kt.style.transition=`width ${T}ms linear`;requestAnimationFrame(()=>kt.style.width="0%");
    timer=setTimeout(()=>{if(!ok_())return;q.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.w===right)b.classList.add("right");});sfx("no");document.getElementById("kmsg").innerHTML=`Hết giờ! Có thể nối bằng <b class="fr">${esc(right)}</b> (${esc(mean(right))}).`;failK(right,`Hết giờ rồi. Bạn nối được ${chain} từ.`);},T);
    q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{clearTimeout(timer);const pick=b.dataset.w,ok=acc.includes(pick[0]);q.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(acc.includes(x.dataset.w[0]))x.classList.add("right");});
      if(!ok){b.classList.add("wrong");sfx("no");document.getElementById("kmsg").innerHTML=`“${esc(pick)}” không bắt đầu bằng ${last}. Đáp án: <b class="fr">${esc(right)}</b>.`;return failK(right,`Bạn nối được ${chain} từ.`);}
      sfx("ok");chain++;used.add(pick);hist.push([pick,"me"]);speak(pick,.85);setTimeout(()=>{if(ok_())ttPlay(pick.slice(-1));},1100);});};

    let h;timer=setTimeout(()=>{h.kill();sfx("no");jg.classList.add("fall");jFail(`Cầu rơi rồi! Bạn đá được ${kicks} cú (${nativeNum(kicks)}).`);},T);

function memoGame(area,end){
  const NP=[0,4,6,8][GL];const set=shuffle(CCARD).slice(0,NP);const cards=shuffle(set.flatMap((c,i)=>[{i,t:"ko",c},{i,t:"pic",c}]));let open=[],moves=0,found=0,lock=false;
  area.innerHTML=`<div class="ytop"><div class="ypl me"><b>Lượt lật</b><span class="sc" id="mv">0</span></div><div class="ypl tt"><b>Cặp tìm được</b><span class="sc" id="mf">0/${NP}</span></div></div>
   <div class="memo n${NP}">${cards.map((x,k)=>`<button class="mcard" data-k="${k}"><span class="mc-in"><span class="mc-back"></span><span class="mc-front">${x.t==="ko"?`<b class="fr">${esc(x.c[0])}</b>`:`<span class="mc-e">${x.c[1]}</span><small>${esc(x.c[2])}</small>`}</span></span></button>`).join("")}</div><div id="mfact"></div>`;
  area.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{if(lock||b.classList.contains("up"))return;b.classList.add("up");sfx("tap");const x=cards[+b.dataset.k];if(x.t==="ko")speak(x.c[0],.85);open.push(b);
    if(open.length===2){moves++;document.getElementById("mv").textContent=moves;const [a,c]=open.map(o=>cards[+o.dataset.k]);
      if(a.i===c.i&&a.t!==c.t){found++;open.forEach(o=>o.classList.add("got"));open=[];sfx("ok");document.getElementById("mf").textContent=found+"/"+NP;
        document.getElementById("mfact").innerHTML=`<div class="card mfact"><span class="mc-e">${a.c[1]}</span><div><b class="fr">${esc(a.c[0])}</b> · ${esc(a.c[2])}<p>${esc(a.c[3])}</p></div></div>`;
        if(found===NP)setTimeout(()=>end(Math.max(10,NP*10-(moves-NP)*4),{win:true,msg:`Tìm đủ ${NP} cặp sau ${moves} lượt!`}),1400);}
      else{lock=true;setTimeout(()=>{open.forEach(o=>o.classList.remove("up"));open=[];lock=false;},850);}}});
}
